<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>經濟 通關 · 市場與效率</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2430;--line:#2d3644;
  --text:#e6edf3;--dim:#8b949e;--acc:#58a6ff;--ok:#3fb950;--bad:#f85149;
  --gold:#d29922;--pur:#a371f7;--rare:#f0883e;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#16202e,#0d1117 60%);color:var(--text);
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
#app{max-width:900px;margin:0 auto;padding:22px 16px 60px}
.hdr{text-align:center;margin:10px 0 16px}
.logo{font-size:30px;font-weight:800;letter-spacing:2px}
.logo span{color:var(--acc)}
.tagline{color:var(--dim);font-size:13px;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.ptitle{font-size:13px;color:var(--dim);letter-spacing:1px;margin-bottom:10px}
.cond{font-size:14px;margin:6px 0;color:var(--dim)}
.cond.on{color:var(--ok)}
.cond b{color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px;
  font-size:15px;cursor:pointer;transition:.15s;text-align:center}
.btn:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#1f6feb,#1a5fd0);border-color:#2f81f7}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.danger{border-color:#6e2b25}
.chap{margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.chap h3{margin:0;font-size:16px}
.chap .w{color:var(--dim);font-size:12px}
.lv{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:12px 14px;margin:7px 0;cursor:pointer}
.lv:hover{border-color:var(--acc)}
.lv.lock{opacity:.38;cursor:not-allowed}
.lv .nm{font-size:14px}
.lv .st{color:var(--gold);letter-spacing:2px;font-size:13px}
.lv .tg{color:var(--dim);font-size:11px;margin-left:6px}
.boss{border:1px dashed #6e40c9;background:linear-gradient(180deg,#1b1630,#161b22)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.bbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--dim);flex-wrap:wrap;gap:6px}
.hp{color:var(--bad);font-size:18px;letter-spacing:2px}
.score{color:var(--acc)}
.gold{color:var(--gold)}
.timer{color:var(--gold);font-variant-numeric:tabular-nums}
.tbar{height:8px;background:#0b0f14;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.tfill{height:100%;background:linear-gradient(90deg,#1f6feb,#a371f7);transition:width .3s}
.tmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.tmeta b{color:var(--text)}
.qtag{font-size:11px;color:var(--dim);letter-spacing:1px;margin-bottom:8px}
.qtext{font-size:17px;line-height:1.55;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px;cursor:pointer;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .k{color:var(--dim);margin-right:8px;font-size:12px}
.opt.correct{border-color:var(--ok);background:#12261a}
.opt.wrong{border-color:var(--bad);background:#2a1416}
.opt.elim{opacity:.3;text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:13px 15px;border-radius:11px;font-size:14px;line-height:1.55}
.fb.ok{background:#0f2417;border:1px solid #1f6f3a}
.fb.no{background:#25110f;border:1px solid #6e2b25}
.fb .t{font-weight:700;margin-bottom:5px}
.fb .t.ok{color:var(--ok)} .fb .t.no{color:var(--bad)}
.crit{color:var(--gold);font-weight:800;margin-left:8px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.center{text-align:center}
.big{font-size:46px;letter-spacing:6px;color:var(--gold);margin:8px 0}
.stat{color:var(--dim);font-size:14px;margin:5px 0}
.stat b{color:var(--text);font-size:17px}
.small{font-size:12px;color:var(--dim);line-height:1.7}
textarea{width:100%;height:150px;background:#0b0f14;color:var(--text);border:1px solid var(--line);border-radius:10px;
  padding:10px;font-family:Consolas,monospace;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.card h4{margin:0 0 8px;font-size:14px;color:var(--acc)}
.card li{font-size:13.5px;line-height:1.75;color:#c9d1d9}
.card .trap{color:var(--rare);font-size:13px;margin-top:8px}
.wq{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.wq .q{font-size:14px;line-height:1.5}
.wq .a{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.6}
.items{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:12px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);cursor:default}
.chip.C{border-color:#3d4654}
.chip.U{border-color:#1f6feb}
.chip.R{border-color:var(--pur)}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}
.offer{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px}
.offer.U{border-color:#1f6feb}.offer.R{border-color:var(--pur)}
.offer .rname{font-weight:700;font-size:15px}
.offer .rar{font-size:10px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);margin-left:6px}
.offer .rdesc{font-size:12.5px;color:#c9d1d9;line-height:1.6;flex:1}
.price{color:var(--gold);font-weight:700;font-size:13px}
.sell{font-size:11px;padding:3px 8px;border-radius:8px;border:1px solid #6e2b25;background:transparent;color:#f08a8a;cursor:pointer}
.dictbtn{position:fixed;right:12px;top:40%;z-index:40;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:10px 8px;width:78px;cursor:pointer;font-size:12px;line-height:1.5;text-align:center}
.dictbtn:hover{border-color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:520px;width:100%;max-height:80vh;overflow:auto}
.mt{font-size:13px;color:var(--acc);letter-spacing:1px;margin-bottom:10px}
.mrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.55}
.mrow b{min-width:86px;color:var(--gold)}
.mrow span{color:#c9d1d9}
@media(max-width:560px){.grid{grid-template-columns:1fr}.logo{font-size:24px}.dictbtn{width:62px;font-size:11px;right:6px}}
</style>
</head>
<body>
<div id="app"></div>
<input id="filein" type="file" accept=".json,application/json" style="display:none">
<script id="structure" type="application/json">__STRUCTURE_JSON__</script>
<script id="bank" type="application/json">__BANK_JSON__</script>
<script>
/* ================= 數據 ================= */
const STRUCT=JSON.parse(document.getElementById('structure').textContent);
const LEVELS=STRUCT.levels;
const CHS=STRUCT.chapters;
/* 術語詞庫：高頻考試縮寫 */
const DICT={
 'MC':'邊際成本（Marginal Cost）：多生產一單位所增加的成本',
 'MB':'邊際利益（Marginal Benefit）：多消費一單位所獲得的利益',
 'MR':'邊際收入（Marginal Revenue）：多賣一單位所增加的收入',
 'AR':'平均收入（Average Revenue），在完全競爭下等於價格',
 'TC':'總成本（Total Cost）＝總固定成本＋總可變成本',
 'TFC':'總固定成本（Total Fixed Cost）',
 'TVC':'總可變成本（Total Variable Cost）',
 'ATC':'平均總成本（Average Total Cost）＝TC ÷ 產量',
 'AVC':'平均可變成本（Average Variable Cost）＝TVC ÷ 產量',
 'AFC':'平均固定成本（Average Fixed Cost）＝TFC ÷ 產量',
 'SMC':'短期邊際成本（Short-run Marginal Cost）',
 'SRAC':'短期平均成本（Short-run Average Cost）',
 'LRAC':'長期平均成本（Long-run Average Cost）',
 'CS':'消費者盈餘（Consumer Surplus）＝願付最大數額－實際支付',
 'PS':'生產者盈餘（Producer Surplus）＝實收數額－最低願收數額',
 'TS':'總社會盈餘（Total Social Surplus）＝CS＋PS',
 'DWL':'淨損失／無謂損失（Deadweight Loss）：缺乏效率而白白流失的總盈餘',
 'PED':'需求價格彈性（Price Elasticity of Demand）',
 'YED':'需求收入彈性（Income Elasticity of Demand）',
 'XED':'需求交叉價格彈性（Cross-price Elasticity of Demand）',
 'PES':'供應價格彈性（Price Elasticity of Supply）',
 'HHI':'赫芬達爾－赫希曼指數（Herfindahl-Hirschman Index）：市場集中度',
 'MRP':'邊際收入產品（Marginal Revenue Product）',
 'P':'價格（Price）',
 'Q':'數量（Quantity）'
};
const ITEMS=[
{id:'marker',name:'螢光筆',rarity:'C',price:7,flat:2,desc:'每題基礎分 +2。'},
{id:'sticky',name:'便利貼',rarity:'C',price:10,flat:3,desc:'每題基礎分 +3。'},
{id:'calc',name:'計數機',rarity:'C',price:9,flat:2,comboMin:4,comboFlat:4,desc:'每題 +2；連擊 ≥4 時再加 +4。'},
{id:'coffee',name:'提神咖啡',rarity:'C',price:8,maxHp:1,desc:'生命上限 +1。'},
{id:'admit',name:'准考證',rarity:'C',price:6,hints:1,desc:'每關開場多 1 次提示。'},
{id:'eraser',name:'橡皮擦',rarity:'C',price:7,skips:1,desc:'每關開場多 1 次跳過。'},
{id:'tuition',name:'補習優惠券',rarity:'C',price:10,shopDisc:0.15,desc:'商店售價與刷新費用 −15%。'},
{id:'abacus',name:'小算盤',rarity:'C',price:9,goldPerCorrect:1,desc:'每答對一題多賺 1 金幣。'},
{id:'errorfile',name:'錯題夾',rarity:'C',price:8,failRefund:4,desc:'關卡失敗返還 4 金幣。'},
{id:'flashcard',name:'速記卡',rarity:'C',price:9,flat:1,goldFlat:{per:20,cap:5},desc:'每題 +1；每 20 金幣再加 +1，最多 +5。'},
{id:'textbook',name:'經濟學原理',rarity:'U',price:16,flat:6,desc:'每題基礎分 +6。'},
{id:'demandcurve',name:'需求曲線尺',rarity:'U',price:15,firstMult:1.6,desc:'每關第 1 題分數 ×1.6。'},
{id:'supplycurve',name:'供應曲線尺',rarity:'U',price:15,lastMult:1.6,desc:'每關最後一題分數 ×1.6。'},
{id:'margin',name:'邊際筆記',rarity:'U',price:17,comboPer:8,desc:'每題額外加「當前連擊數」，最多 +8。'},
{id:'combocharm',name:'連擊徽章',rarity:'U',price:17,comboMin:5,comboMult:1.15,desc:'連擊 ≥5 時，分數再 ×1.15。'},
{id:'midterm',name:'期中考卷',rarity:'U',price:16,posMult:{4:1.25,5:1.25,6:1.25},desc:'每關第 4–6 題分數 ×1.25。'},
{id:'slide',name:'計算尺',rarity:'U',price:18,mult:1.2,desc:'分數固定 ×1.2。'},
{id:'lucky',name:'幸運橡皮',rarity:'U',price:14,critAdd:0.08,desc:'暴擊率 +8%（基礎 5%）。'},
{id:'portfolio',name:'投資組合',rarity:'U',price:16,critMult:2.5,desc:'暴擊倍率由 ×2 提升到 ×2.5。'},
{id:'shield',name:'學分護盾',rarity:'U',price:15,shield:1,desc:'每關擋掉 1 次答錯（不扣血）。'},
{id:'retake',name:'補考機會',rarity:'U',price:18,revive:1,desc:'每關剩最後 1 命時免死一次。'},
{id:'backpack',name:'大書包',rarity:'U',price:14,shopSlots:1,desc:'商店多 1 個道具格子。'},
{id:'profnotes',name:'教授私人筆記',rarity:'R',price:28,flat:10,desc:'每題基礎分 +10。'},
{id:'nobel',name:'諾貝爾筆記',rarity:'R',price:32,mult:1.5,desc:'分數固定 ×1.5。'},
{id:'battery',name:'連擊電池',rarity:'R',price:30,comboMin:3,comboMult:1.3,desc:'連擊 ≥3 時，分數再 ×1.3。'},
{id:'timer',name:'時間延長器',rarity:'R',price:24,bossTime:1,desc:'章末 Boss 戰多 5 分鐘。'},
{id:'perfection',name:'滿分執念',rarity:'R',price:26,goldPerCorrect:3,endGold:8,desc:'每答對一題 +3 金幣，過關額外 +8 金幣。'}
];
const SKEY='econ_rogue_v1', CKEY='econ_custom_bank_v1', SLOTS=5;
const BASE=JSON.parse(document.getElementById('bank').textContent||'[]');
function loadCustom(){try{return JSON.parse(localStorage.getItem(CKEY)||'[]')}catch(e){return[]}}
let BANK=BASE.concat(loadCustom());

/* ================= 狀態 ================= */
function fresh(){return {v:3,stars:{},boss:{},gold:4,items:[],wrong:{},glossary:{},combo:0,mockPass:0,best:0,seen:{},tot:{q:0,c:0}}}
let S=fresh();
try{const raw=localStorage.getItem(SKEY);if(raw){const o=JSON.parse(raw);if(o&&o.v===3)S=Object.assign(fresh(),o)}}catch(e){}
// 清掉已刪除道具的殘留 id（如舊版錯題本），避免讀取不存在的道具時報錯
S.items=(S.items||[]).filter(id=>ITEMS.some(i=>i.id===id));
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}

const L=(id)=>LEVELS.find(x=>x.id===id);
const levelsOf=(ch)=>LEVELS.filter(x=>x.ch===ch);
const poolOf=(id)=>BANK.filter(q=>q.level===id);
const poolCh=(ch)=>BANK.filter(q=>q.ch===ch);
const starsOf=(id)=>S.stars[id]||0;
const chUnlocked=(ch)=>ch===1||!!S.boss[ch-1];
function lvUnlocked(id){const l=L(id);if(!chUnlocked(l.ch))return false;const arr=levelsOf(l.ch);const i=arr.findIndex(x=>x.id===id);return i===0||starsOf(arr[i-1].id)>0}
const bossUnlocked=(ch)=>levelsOf(ch).every(l=>starsOf(l.id)>0);
const wrongIds=()=>Object.keys(S.wrong).filter(id=>BANK.some(q=>q.id===id));
const wrongCount=()=>wrongIds().length;
const owned=()=>S.items.map(id=>ITEMS.find(i=>i.id===id)).filter(Boolean);
const sumOwned=(k)=>owned().reduce((a,i)=>a+(i[k]||0),0);
const maxHpBase=()=>Math.max(1,3+sumOwned('maxHp'));
const critBase=()=>0.05+sumOwned('critAdd');
const critMultOf=()=>Math.max(2,...owned().map(i=>i.critMult||2));
const shopDisc=()=>sumOwned('shopDisc');
const rarityW=(ch)=>ch===1?{C:6,U:3,R:1}:ch===2?{C:4,U:4,R:2}:{C:3,U:4,R:3};

/* ================= 抽題 ================= */
function weightOf(q){const m=S.wrong[q.id]||0;const d=q.diff||2;return (1+Math.min(m,3)*1.6)*(1+0.22*(d-2))}
function pick(pool,n){
  const items=pool.map(q=>({q,w:weightOf(q)}));const out=[];
  while(out.length<n&&items.length){
    let tot=items.reduce((a,b)=>a+b.w,0),r=Math.random()*tot,k=0;
    for(let i=0;i<items.length;i++){r-=items[i].w;if(r<=0){k=i;break}}
    out.push(items.splice(k,1)[0].q);
  }
  return out;
}
function rollItem(){
  const w=rarityW(B.currentLevel?L(B.currentLevel).ch:1);
  const ownedIds=new Set(S.items);
  const pool=ITEMS.filter(i=>!ownedIds.has(i.id));
  if(!pool.length)return null;
  const tot=pool.reduce((a,i)=>a+w[i.rarity],0);let r=Math.random()*tot;
  for(const it of pool){r-=w[it.rarity];if(r<=0)return it}
  return pool[0];
}
function rollOffers(n){
  const out=[];const used=new Set(S.items);
  for(let k=0;k<n;k++){
    const w=rarityW(B.currentLevel?L(B.currentLevel).ch:1);
    const pool=ITEMS.filter(i=>!used.has(i.id));
    if(!pool.length)break;
    const tot=pool.reduce((a,i)=>a+w[i.rarity],0);let r=Math.random()*tot;let sel=pool[0];
    for(const it of pool){r-=w[it.rarity];if(r<=0){sel=it;break}}
    out.push(sel.id);used.add(sel.id);
  }
  return out;
}

/* ================= 計分 ================= */
function calcScore(idx){
  let flat=10,mult=1,critC=critBase(),critM=critMultOf(),cScale=0;
  const combo=B.combo;
  for(const it of owned()){
    flat+=it.flat||0;
    if(it.goldFlat)flat+=Math.min(it.goldFlat.cap||99,Math.floor(S.gold/it.goldFlat.per));
    if(it.comboPer)flat+=Math.min(it.comboPer,combo);
    if(it.lateFlat&&idx>=3)flat+=it.lateFlat;
    if(it.comboMin&&combo>=it.comboMin)flat+=it.comboFlat||0;
    if(it.comboMult&&combo>=it.comboMin)mult*=it.comboMult;
    if(it.firstMult&&idx===0)mult*=it.firstMult;
    if(it.lastMult&&idx===B.qs.length-1)mult*=it.lastMult;
    if(it.posMult&&it.posMult[idx+1])mult*=it.posMult[idx+1];
    if(it.mult)mult*=it.mult;
    cScale+=it.comboScale||0;
  }
  let streak=1+0.25*(combo-1)+cScale*(combo-1);
  if(streak>4)streak=4; // 連擊倍率上限，跨關累積時防止數值失控
  const crit=Math.random()<critC;
  const v=Math.round(flat*streak*mult*(crit?critM:1));
  return {v,crit};
}

/* ================= 通用 ================= */
let screen='menu',B=null,timer=null;
const $=()=>document.getElementById('app');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function itemChips(sell){
  if(!S.items.length)return '<span class="small">道具欄空著</span>';
  return S.items.map((id,k)=>{const it=ITEMS.find(i=>i.id===id);if(!it)return '';
    return `<span class="chip ${it.rarity}" title="${esc(it.desc)}">${it.name}${sell?` <button class="sell" data-act="sell" data-k="${k}">賣</button>`:''}</span>`}).join('');
}
function itemBar(){return `<div class="items">${itemChips(false)}</div>`}
function termsIn(q){
  const text=q.q+' '+q.opts.join(' ');
  const re=/\b[A-Z][A-Za-z0-9]{1,7}\b/g;
  const out=[],seen=new Set();let m;
  while((m=re.exec(text))){const t=m[0];if(DICT[t]&&!seen.has(t)){seen.add(t);out.push(t)}}
  return out;
}
function dictPrice(){return 2+((B&&B.dictUses)||0)}
function lookup(){
  if(!B||!B.qs)return;
  const q=B.qs[B.i];const terms=termsIn(q);
  if(!terms.length){alert('本題題面和選項裡沒有收錄的縮寫。');return}
  const price=dictPrice();
  if(S.gold<price){alert(`金幣不夠，查一次要 ${price} 金幣。`);return}
  S.gold-=price;B.dictUses=(B.dictUses||0)+1;
  B.dictTerms=terms;B.dictOpen=true;
  B.dictThis=(B.dictThis||[]).concat(terms.filter(t=>!(B.dictThis||[]).includes(t)));
  terms.forEach(t=>{S.glossary[t]=(S.glossary[t]||0)+1});
  save();render();
}

/* ================= 視圖 ================= */
function render(){
  const map={menu:viewMenu,map:viewMap,intro:viewIntro,battle:viewBattle,fail:viewFail,reward:viewReward,
    shop:viewShop,mock:viewMock,mockresult:viewMockResult,review:viewReview,cards:viewCards,import:viewImport};
  $().innerHTML=(map[screen]||viewMenu)();
  if(B&&B.deadline&&(screen==='battle'||screen==='mock'))startTimer();
}
function startTimer(){
  clearInterval(timer);timer=setInterval(()=>{
    const el=document.getElementById('timer');
    if(!el||!B||!B.deadline){clearInterval(timer);return}
    const left=B.deadline-Date.now();el.textContent=fmt(left);
    if(left<=0){clearInterval(timer);if(B.mode==='mock')mockSubmit();else{B.hp=0;finishBattle()}}
  },500);
}

function viewMap(){
  let h=`<div class="hdr"><div class="logo">闖關地圖</div>
  <div class="tagline">金幣 ${S.gold} · 道具 ${S.items.length}/${SLOTS} · 每關 6 題</div></div>
  <div class="items">${itemChips(false)}</div>`;
  for(const c of CHS){
    const un=chUnlocked(c.n);const done=!!S.boss[c.n];
    h+=`<div class="chap"><h3>${c.name}</h3><div class="w">${c.weight>0?c.weight+'%':'額外'}${done?' · 已通關':''}</div></div>`;
    for(const l of levelsOf(c.n)){
      const st=starsOf(l.id);const ok=lvUnlocked(l.id);
      h+=`<div class="lv ${ok?'':'lock'}" data-act="${ok?'intro':''}" data-id="${l.id}">
        <div class="nm">${ok?'':'🔒 '}${l.name}<span class="tg">目標 ${l.target}</span></div>
        <div class="st">${st?('★'.repeat(st)+'☆'.repeat(3-st)):'☆☆☆'}</div></div>`;
    }
    if(un){
      const bo=bossUnlocked(c.n);
      h+=`<div class="lv boss ${bo?'':'lock'}" data-act="${bo?'boss':''}" data-ch="${c.n}">
        <div class="nm">${bo?`⚔️ 章末 Boss（20 題 · 15 分鐘 · 目標 ${c.bossTarget}）`:'🔒 章末 Boss（先清完本章關卡）'}</div>
        <div class="st">${done?'已擊敗':'未挑戰'}</div></div>`;
    }else{
      h+=`<div class="lv lock"><div class="nm">🔒 完成上一章 Boss 後解鎖</div><div class="st"></div></div>`;
    }
  }
  h+=`<div class="row"><button class="btn small ghost" data-act="menu">← 返回主菜單</button></div>`;
  return h;
}

function viewBattle(){

  return `<div class="bbar">
    <div class="hp">${isReview?'錯題重練':('♥'.repeat(Math.max(0,B.hp))+'♡'.repeat(Math.max(0,B.maxhp-B.hp)))}</div>
    <div>${B.mode==='boss'?'⚔️ Boss · ':''}第 ${B.i+1}/${B.qs.length} 題</div>
    <div>${B.deadline?`<span class="timer" id="timer">--:--</span>`:''}</div>
    <div><span class="gold">💰${S.gold}</span>　連擊 ${B.combo}</div>
  </div>
  ${isReview?'':`<div class="tbar"><div class="tfill" style="width:${pct}%"></div></div>
  <div class="tmeta"><span>得分 <b>${B.score}</b></span><span>目標 <b>${B.target}</b></span></div>`}
  ${itemBar()}
  <div class="qcard" style="margin-top:10px">
    <div class="qtag">${q.level} · ${q.tag} · 難度 ${'●'.repeat(q.diff||2)} · 來源 ${q.src||'原創'}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.opts.map((o,i)=>{
      let cls='opt';
      if(B.elim.includes(i))cls+=' elim';
      if(revealed){if(i===q.ans)cls+=' correct';else if(i===B.sel)cls+=' wrong'}
      return `<button class="${cls}" data-act="opt" data-i="${i}" ${revealed||B.elim.includes(i)?'disabled':''}>

/* ================= 流程 ================= */
function startLevel(id){
  const l=L(id);const pool=poolOf(id);
  if(!pool.length){alert('這個關卡還沒有題目');return}
  const myMax=maxHpBase();
  B={mode:'level',currentLevel:id,qs:pick(pool,6),i:0,hp:myMax,maxhp:myMax,target:l.target,
     score:0,combo:(S.combo||0),correct:0,sel:null,elim:[],hints:sumOwned('hints'),shieldLeft:sumOwned('shield'),
     skips:sumOwned('skips'),dictUses:0,dictThis:[],
     reviveLeft:owned().some(x=>x.revive)?1:0,gain:0,crit:false};
  screen='battle';render();
}
function startBoss(ch){
  const c=CHS.find(x=>x.n===ch);const pool=poolCh(ch);
  const myMax=maxHpBase();
  const extra=owned().some(x=>x.bossTime)?300:0;
  B={mode:'boss',currentLevel:levelsOf(ch).slice(-1)[0].id,ch,qs:pick(pool,20),i:0,hp:myMax,maxhp:myMax,
     target:c.bossTarget,score:0,combo:(S.combo||0),correct:0,sel:null,elim:[],hints:sumOwned('hints'),
     shieldLeft:sumOwned('shield'),skips:sumOwned('skips'),dictUses:0,dictThis:[],
     reviveLeft:owned().some(x=>x.revive)?1:0,gain:0,crit:false,
     deadline:Date.now()+(15*60+extra)*1000};
  screen='battle';render();
}
function answer(idx){
  if(!B||B.sel!==null||B.elim.includes(idx))return;
  const q=B.qs[B.i];B.sel=idx;B.gain=0;B.crit=false;B.dmg=0;S.tot.q++;
  if(idx===q.ans){
    B.correct++;S.tot.c++;B.combo++;
    const r=calcScore(B.i);B.gain=r.v;B.crit=r.crit;B.score+=r.v;
    S.gold+=sumOwned('goldPerCorrect');
    if(B.mode==='review'&&S.wrong[q.id]){S.wrong[q.id]--;if(S.wrong[q.id]<=0)delete S.wrong[q.id]}
  }else{
    S.wrong[q.id]=(S.wrong[q.id]||0)+1;
    // 連擊越高，失誤代價越大：連擊 ≥6 時答錯扣 2 生命
    B.dmg=(B.combo||0)>=6?2:1;
    B.combo=0;
    if(B.reviveLeft>0&&B.hp<=1){B.hp=Math.max(1,B.hp-1);B.reviveLeft--; }
    else if(B.shieldLeft>0){B.shieldLeft--; }
    else B.hp-=B.dmg;
  }
  if(B.mode!=='review')S.combo=B.combo;
  save();render();
}
function useHint(){
  if(!B||B.hints<=0||B.sel!==null)return;
  const q=B.qs[B.i];
  const wrongs=q.opts.map((_,i)=>i).filter(i=>i!==q.ans&&!B.elim.includes(i));
  if(!wrongs.length)return;
  B.elim.push(wrongs[Math.floor(Math.random()*wrongs.length)]);
  B.hints--;render();
}
function skipQ(){
  if(!B||B.sel!==null||B.skips<=0)return;
  B.skips--;B.i++;B.sel=null;B.gain=0;
  if(B.i>=B.qs.length){finishBattle();return}
  render();
}
function nextQ(){
  if(!B||B.sel===null)return;
  B.i++;B.sel=null;B.gain=0;
  if(B.hp<=0||B.i>=B.qs.length){
    if(B.mode==='review'){B=null;screen='review';render();return}
    finishBattle();return}
  render();
}
function finishBattle(){
  clearInterval(timer);
  const total=B.qs.length;
  if(B.mode==='review'){B=null;screen='review';render();return}
  const pass=B.score>=B.target&&B.hp>0;
  const ch=B.mode==='boss'?B.ch:L(B.currentLevel).ch;
  if(!pass){
    let refund=0;
    if(B.mode==='level'||B.mode==='boss'){refund=sumOwned('failRefund')}
    if(refund){S.gold+=refund}
    S.combo=0; // 關卡失敗，連擊斷
    B.result={score:B.score,target:B.target,correct:B.correct,total,refund};
    B.hp=Math.max(0,B.hp);save();screen='fail';render();return;
  }
  const ratio=B.score/B.target;
  let goldGain=4+B.hp*2+(ratio>=1.3?2:0)+sumOwned('endGold');
  if(B.mode==='boss')goldGain+=8;
  S.gold+=goldGain;
  if(B.mode==='level'){
    const stars=ratio>=1.4?3:ratio>=1.15?2:1;
    S.stars[B.currentLevel]=Math.max(starsOf(B.currentLevel),stars);
  }else{
    S.boss[B.ch]=1;
  }
  save();
  S.pending={offers:rollOffers(3+(owned().some(x=>x.rewardExtra)?1:0)),goldGain};
  screen='reward';render();
}
function openShop(){
  S.shop={offers:rollOffers(3+sumOwned('shopSlots')),rerollCost:2};
  screen='shop';render();
}
function shopPrice(it){
  const disc=shopDisc();
  return Math.max(1,Math.round(it.price*(1-disc)));
}
function buyItem(k){
  const sh=S.shop;if(!sh)return;
  const id=sh.offers[k];if(!id)return;
  const it=ITEMS.find(i=>i.id===id);
  if(S.items.length>=SLOTS){alert('道具欄已滿，先賣一個');return}
  const p=Math.round(it.price*(1-shopDisc()));
  if(S.gold<p){alert('金幣不夠');return}
  S.gold-=p;S.items.push(id);sh.offers.splice(k,1);save();render();
}
function reroll(){
  const sh=S.shop;if(!sh)return;
  const cost=Math.round(sh.rerollCost*(1-shopDisc()));
  if(S.gold<cost){alert('金幣不夠');return}
  S.gold-=cost;sh.offers=rollOffers(3+sumOwned('shopSlots'));sh.rerollCost+=1;save();render();
}
function sellItem(k){
  if(!S.items[k])return;
  const it=ITEMS.find(i=>i.id===S.items[k]);
  const back=Math.max(1,Math.floor(it.price/2));
  S.items.splice(k,1);S.gold+=back;save();render();
}
function pickOffer(id){
  if(S.items.length>=SLOTS){alert('道具欄已滿，先賣一個');return}
  S.items.push(id);save();openShop();
}
function skipOffer(){S.gold+=4;save();openShop();}
function startMock(){
  const qs=pick(BANK,Math.min(50,BANK.length));
  B={mode:'mock',qs,i:0,answers:new Array(qs.length).fill(null),deadline:Date.now()+60*60*1000};
  screen='mock';render();
}
function mockAns(idx){B.answers[B.i]=idx;render()}
function mockNext(){if(B.i<B.qs.length-1)B.i++;render()}
function mockPrev(){if(B.i>0)B.i--;render()}
function mockSubmit(){
  clearInterval(timer);
  let correct=0;B.qs.forEach((q,i)=>{if(B.answers[i]===q.ans)correct++});
  const score=Math.round(correct/B.qs.length*1000);
  const pass=score>=700;if(pass)S.mockPass++;
  S.best=Math.max(S.best,score);S.tot.q+=B.qs.length;S.tot.c+=correct;save();
  B.result={correct,score,pass};screen='mockresult';render();
}
function resetAll(){
  if(!confirm('清空所有進度（導入的題庫會保留）？'))return;
  S=fresh();save();screen='menu';render();
}
function importBank(text){
  let data;try{data=JSON.parse(text)}catch(e){alert('JSON 解析失敗：'+e.message);return}
  if(!Array.isArray(data)){alert('需要一個數組');return}
  const ok=data.filter(d=>d&&d.id&&d.q&&Array.isArray(d.opts)&&d.opts.length===4&&Number.isInteger(d.ans)&&d.level);
  if(!ok.length){alert('沒有合法題目');return}
  ok.forEach(d=>{d.ch=d.ch||Number(String(d.level)[0]);d.src=d.src||'導入'});
  const custom=loadCustom().filter(x=>!ok.some(y=>y.id===x.id)).concat(ok);
  try{localStorage.setItem(CKEY,JSON.stringify(custom))}catch(err){alert('題庫太大，存不下：'+err.message);return}
  BANK=BASE.concat(custom);
  alert(`導入 ${ok.length} 題，當前題庫 ${BANK.length} 題`);
  screen='menu';render();
}

/* ================= 交互 ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='map'){screen='map';render()}
  else if(act==='menu'){screen='menu';render()}
  else if(act==='cards'){screen='cards';render()}
  else if(act==='review'){screen='review';render()}
  else if(act==='review-run'){
    const ids=wrongIds();const qs=pick(ids.map(id=>BANK.find(q=>q.id===id)),Math.min(10,ids.length));
    B={mode:'review',qs,i:0,hp:99,maxhp:99,target:0,score:0,combo:0,correct:0,sel:null,elim:[],hints:0,
       shieldLeft:0,reviveLeft:0,dictUses:0,dictThis:[],gain:0,crit:false};
    screen='battle';render();
  }
  else if(act==='import'){screen='import';render()}
  else if(act==='reset'){resetAll()}
  else if(act==='intro'){B={currentLevel:el.dataset.id};screen='intro';render()}
  else if(act==='start'){startLevel(B.currentLevel)}
  else if(act==='opt'){answer(+el.dataset.i)}
  else if(act==='hint'){useHint()}
  else if(act==='skipq'){skipQ()}
  else if(act==='dict'){lookup()}
  else if(act==='dict-close'){B.dictOpen=false;render()}
  else if(act==='next'){nextQ()}
  else if(act==='flee'){clearInterval(timer);screen='map';B=null;render()}
  else if(act==='retry'){B.sel=null;if(B.mode==='boss')startBoss(B.ch);else startLevel(B.currentLevel)}
  else if(act==='boss'){startBoss(+el.dataset.ch)}
  else if(act==='pick'){pickOffer(el.dataset.id)}
  else if(act==='skip'){skipOffer()}
  else if(act==='buy'){buyItem(+el.dataset.k)}
  else if(act==='reroll'){reroll()}
  else if(act==='leave'){screen='map';render()}
  else if(act==='sell'){sellItem(+el.dataset.k)}
  else if(act==='mock'){startMock()}
  else if(act==='mopt'){mockAns(+el.dataset.i)}
  else if(act==='mock-next'){if(B.i===B.qs.length-1)mockSubmit();else mockNext()}
  else if(act==='mock-prev'){mockPrev()}
  else if(act==='mock-submit'){if(confirm('確定交卷？'))mockSubmit()}
  else if(act==='import-text'){importBank(document.getElementById('importbox').value)}
  else if(act==='import-file'){document.getElementById('filein').click()}
});
document.getElementById('filein').addEventListener('change',ev=>{
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>importBank(r.result);r.readAsText(f,'utf-8');
});
document.addEventListener('keydown',e=>{
  if(screen==='battle'){
    if(B&&B.sel!==null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nextQ()}
    else if(/^[1-4]$/.test(e.key))answer(+e.key-1);
  }else if(screen==='mock'&&/^[1-4]$/.test(e.key)){mockAns(+e.key-1)}
});
render();
</script>
