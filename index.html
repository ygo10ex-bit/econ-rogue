<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>經濟 通關 · 市場與效率</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2430;--line:#2d3644;
  --text:#e6edf3;--dim:#8b949e;--acc:#58a6ff;--ok:#3fb950;--bad:#f85149;
  --gold:#d29922;--pur:#a371f7;--rare:#f0883e;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#16202e,#0d1117 60%);color:var(--text);
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
#app{max-width:900px;margin:0 auto;padding:22px 16px 60px}
.hdr{text-align:center;margin:10px 0 16px}
.logo{font-size:30px;font-weight:800;letter-spacing:2px}
.logo span{color:var(--acc)}
.tagline{color:var(--dim);font-size:13px;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.ptitle{font-size:13px;color:var(--dim);letter-spacing:1px;margin-bottom:10px}
.cond{font-size:14px;margin:6px 0;color:var(--dim)}
.cond.on{color:var(--ok)}
.cond b{color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px;
  font-size:15px;cursor:pointer;transition:.15s;text-align:center}
.btn:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#1f6feb,#1a5fd0);border-color:#2f81f7}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.danger{border-color:#6e2b25}
.chap{margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.chap h3{margin:0;font-size:16px}
.chap .w{color:var(--dim);font-size:12px}
/* ===== 玩家數據 ===== */
.stlist{margin:14px 0 4px}
.strow{padding:13px 10px;border-bottom:1px solid var(--line);position:relative;padding-right:78px}
.strow.me{box-shadow:inset 2px 0 0 var(--acc);padding-left:14px}
.stn{font-size:14.5px;font-weight:600}
.stme{display:inline-block;font-size:10px;font-weight:800;color:#0d1117;background:var(--acc);
  border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:2px}
.stg{display:inline-block;font-size:10px;font-weight:700;color:#9a8fc4;background:#1c2430;
  border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:2px}
.stm{font-size:12.5px;color:#b9c4d2;margin-top:4px}
.stm2{font-size:11.5px;color:var(--dim);margin-top:2px}
.std{position:absolute;right:10px;top:13px;font-size:11px;color:var(--dim)}
.namein{width:100%;padding:12px 14px;font-size:16px;color:var(--text);
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-family:inherit;outline:none}
.namein:focus{border-color:var(--acc)}
/* 關卡列：不畫卡片，靠分隔線與間距分組 */
.lv{display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  background:none;border:0;border-bottom:1px solid var(--line);
  padding:13px 6px;transition:background .12s,padding-left .12s}
.lv:hover{background:rgba(88,166,255,.06);padding-left:17px}
.lv.lock{opacity:.45;cursor:not-allowed}
.lv.lock:hover{background:none;padding-left:6px}
.lv.now{box-shadow:inset 2px 0 0 var(--acc);padding-left:15px}
.lv .nm{font-size:14.5px;display:flex;align-items:center;gap:10px}
.lv .st{color:#7d6c26;letter-spacing:2px;font-size:12px}
.lv .st.on{color:var(--gold)}
.lv .tg{color:var(--dim);font-size:11px;margin-left:2px}
.lv.boss{border-top:1px solid var(--line);border-bottom:0;margin-top:3px}
.lv.boss .nm{color:var(--pur)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.bbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--dim);flex-wrap:wrap;gap:6px}
.hp{color:var(--bad);font-size:18px;letter-spacing:2px}
.score{color:var(--acc)}
.gold{color:var(--gold)}
.timer{color:var(--gold);font-variant-numeric:tabular-nums}
.tbar{height:8px;background:#0b0f14;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.tfill{height:100%;background:linear-gradient(90deg,#1f6feb,#a371f7);transition:width .3s}
.tmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.tmeta b{color:var(--text)}
.qtag{font-size:11px;color:var(--dim);letter-spacing:1px;margin-bottom:8px}
.qtext{font-size:17px;line-height:1.55;margin-bottom:16px}
/* 選項：不畫框，靠分隔線與間距分組 */
.opt{display:block;width:100%;text-align:left;color:var(--text);cursor:pointer;line-height:1.55;
  background:none;border:0;border-bottom:1px solid #2d3644;border-radius:0;
  padding:13px 8px;margin:0;font-size:15px;transition:background .12s,padding-left .12s}
.opt:last-of-type{border-bottom:0}
.opt:hover:not(:disabled){background:rgba(88,166,255,.06);padding-left:16px}
.opt .k{color:var(--acc);margin-right:12px;font-size:12px;font-weight:700}
.opt.correct{background:rgba(63,185,80,.12);border-bottom-color:var(--ok);box-shadow:inset 2px 0 0 var(--ok)}
.opt.wrong{background:rgba(248,81,73,.12);border-bottom-color:var(--bad);box-shadow:inset 2px 0 0 var(--bad)}
.opt.elim{opacity:.3;text-decoration:line-through}
.opt:disabled{cursor:default}
/* 金幣標記 */
.coin{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:-1px;margin-right:4px;
  background:radial-gradient(circle at 34% 30%,#ffeaa6,#d29922 52%,#8a5f00 100%)}
.fb{margin-top:14px;padding:13px 15px;border-radius:11px;font-size:14px;line-height:1.55}
.fb.ok{background:#0f2417;border:1px solid #1f6f3a}
.fb.no{background:#25110f;border:1px solid #6e2b25}
.fb .t{font-weight:700;margin-bottom:5px}
.fb .t.ok{color:var(--ok)} .fb .t.no{color:var(--bad)}
.crit{color:var(--gold);font-weight:800;margin-left:8px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.center{text-align:center}
.big{font-size:46px;letter-spacing:6px;color:var(--gold);margin:8px 0}
.stat{color:var(--dim);font-size:14px;margin:5px 0}
.stat b{color:var(--text);font-size:17px}
.small{font-size:12px;color:var(--dim);line-height:1.7}
textarea{width:100%;height:150px;background:#0b0f14;color:var(--text);border:1px solid var(--line);border-radius:10px;
  padding:10px;font-family:Consolas,monospace;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.card h4{margin:0 0 8px;font-size:14px;color:var(--acc)}
.card li{font-size:13.5px;line-height:1.75;color:#c9d1d9}
.card .trap{color:var(--rare);font-size:13px;margin-top:8px}
.wq{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.wq .q{font-size:14px;line-height:1.5}
.wq .a{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.6}
.items{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:12px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);cursor:default}
.chip.C{border-color:#3d4654}
.chip.U{border-color:#1f6feb}
.chip.R{border-color:var(--pur)}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}
.offer{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px}
.offer.U{border-color:#1f6feb}.offer.R{border-color:var(--pur)}
.offer .rname{font-weight:700;font-size:15px}
.offer .rar{font-size:10px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);margin-left:6px}
.offer .rdesc{font-size:12.5px;color:#c9d1d9;line-height:1.6;flex:1}
.price{color:var(--gold);font-weight:700;font-size:13px}
.sell{font-size:11px;padding:3px 8px;border-radius:8px;border:1px solid #6e2b25;background:transparent;color:#f08a8a;cursor:pointer}
.dictbtn{position:fixed;right:12px;top:40%;z-index:40;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:10px 8px;width:78px;cursor:pointer;font-size:12px;line-height:1.5;text-align:center}
.dictbtn:hover{border-color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:520px;width:100%;max-height:80vh;overflow:auto}
.mt{font-size:13px;color:var(--acc);letter-spacing:1px;margin-bottom:10px}
.mrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.55}
.mrow b{min-width:86px;color:var(--gold)}
.mrow span{color:#c9d1d9}
@media(max-width:560px){.grid{grid-template-columns:1fr}.logo{font-size:24px}.dictbtn{width:62px;font-size:11px;right:6px}}
</style>
</head>

<script id="structure" type="application/json">{"chapters":[{"n":1,"name":"第一章 市場與市場結構","weight":55,"bossTarget":450},{"n":2,"name":"第二章 效率、公平與政府的角色","weight":45,"bossTarget":650}],"levels":[{"id":"1-1","ch":1,"name":"市場的定義與功能","target":45,"card":["市場不必局限於一個實際地點：只要買方與賣方為交易商品和服務而接觸，就是一個市場","商品 goods 是實物，服務 services 是無形勞務，兩者都在市場上交易","市場把分散的買方需求與賣方供應連在一起，形成價格","價格不是任何一方單獨決定的，是買賣雙方互動的結果"],"trap":"市場不等於一個具體的買賣場所：網店、外賣平台、二手拍賣群都是市場"},{"id":"1-2","ch":1,"name":"市場結構的分類","target":55,"card":["市場結構＝一種具有特定特徵和競爭行為的典型市場形式","市場可按其市場結構形成來分類：完全競爭市場 / 不完全競爭市場","不完全競爭再分三種：壟斷性競爭、寡頭壟斷、壟斷","分類看的是賣家數目、商品性質、進入市場的容易度、市場資訊、競爭行為、市場影響力"],"trap":"壟斷性競爭不是壟斷：它是「很多賣家 + 異質商品」"},{"id":"1-3","ch":1,"name":"四種市場結構的特徵","target":70,"card":["壟斷：只有 1 個賣家、進入受限制、資訊不完全、對價格影響力最大","寡頭壟斷：少數生產者、商品可同質可異質、進入困難、資訊不完全","壟斷性競爭：很多賣家、異質商品、進出容易、資訊不完全","完全競爭：很多賣家、同質商品、進出容易、資訊完全"],"trap":"「同質商品」只出現在完全競爭與寡頭壟斷；壟斷性競爭一定是異質商品"},{"id":"1-4","ch":1,"name":"競爭行為與市場影響力","target":80,"card":["價格競爭＝用降價搶客；非價格競爭＝廣告、品牌、包裝、服務、贈品","完全競爭市場既沒有價格競爭也沒有非價格競爭，賣家是受價者 price taker","壟斷、寡頭壟斷、壟斷性競爭三者都有價格競爭與非價格競爭，都是定價者 price maker","競爭程度：壟斷（最低）→ 寡頭壟斷 → 壟斷性競爭 → 完全競爭（最高）"],"trap":"只有完全競爭市場是「受價者」，其餘三種都能影響價格"},{"id":"2-1","ch":2,"name":"總利益與邊際利益","target":120,"card":["總利益：消費者消費某一數量的物品所獲得的全部利益","邊際利益：消費者消費額外一單位物品所獲得的利益","邊際利益＝消費者願意為額外一單位物品付出的最大數額","邊際利益曲線就是需求曲線，通常是向下傾斜的","只要邊際利益多於價格就繼續買，直到價格等於邊際利益為止"],"trap":"邊際看的是「多一單位」，總利益是累加；不要把兩個混在一起"},{"id":"2-2","ch":2,"name":"消費者盈餘","target":140,"card":["消費者盈餘＝消費者願意支付的最大數額 − 實際支付數額","圖上是需求曲線以下、價格線以上的面積","價格下跌時消費者盈餘增加：舊買家付少了，新買家加入","若賣方能逐單位按消費者的願付價收費，消費者盈餘會被全部吃掉"],"trap":"消費者盈餘要扣掉「實際付出的錢」，不是等於總利益"},{"id":"2-3","ch":2,"name":"成本、邊際成本與生產者盈餘","target":165,"card":["總成本 = 固定成本 + 可變成本","邊際成本＝額外生產一單位所帶來的成本＝生產者願意收取的最低數額","邊際成本曲線就是供應曲線；價格高於邊際成本才值得再生產","生產者會一直生產直到價格等於邊際成本","生產者盈餘＝生產者願意收取的最少數額與實際收取數額的差距"],"trap":"固定成本不影響邊際成本，但它決定「要不要開門營業」"},{"id":"2-4","ch":2,"name":"效率與淨損失","target":190,"card":["效率：市場處於均衡點，價格 = 邊際利益 = 邊際成本","此時總社會盈餘（消費者盈餘 + 生產者盈餘）達到最大","缺乏效率：市價高於均衡價格 → 交易量少於均衡量 → 出現淨損失","淨損失＝總社會盈餘中沒有被獲取的那部分，白白流失","價格上限、價格下限、稅、壟斷定價都可能造成淨損失"],"trap":"淨損失不是「某一方賺少了」，而是消費者與生產者加起來的總盈餘變少"}]}</script>
<script id="bank" type="application/json">[{"id":"1-1-01","ch":1,"level":"1-1","tag":"市場定義","diff":2,"q":"在經濟學上，構成一個「市場」最關鍵的條件是什麼？","opts":["必須有一個固定的實體交易場地","買方與賣方為交易商品或服務而接觸","必須有政府部門監管交易價格","必須有大量賣家同時存在"],"ans":1,"exp":"解析：市場的核心是買賣雙方為交易商品或服務而接觸，地點並不是必要條件；實體場地只是其中一種形式，網店同樣是市場。政府監管與賣家數目都不是構成市場的必要條件。把市場等同於場所，是最常見的誤解。","src":"課堂筆記 Ch12"},{"id":"1-1-02","ch":1,"level":"1-1","tag":"市場界定","diff":3,"q":"以下哪一項不符合市場的定義，並「不是」一個市場？","opts":["一個二手拍賣的網上群組","外賣平台上餐廳與顧客的交易","一間只供員工休息、不對外營業的茶水間","街市裡幾十檔售賣青菜的攤位"],"ans":2,"exp":"解析：判斷市場的標準是有沒有買賣雙方為交易而接觸，而不是有沒有場地。網上群組、外賣平台、街市攤位都符合這條件。茶水間沒有人就商品或服務進行買賣，因此不構成市場。陷阱正是把「場所」當成「市場」。","src":"課堂筆記 Ch12"},{"id":"1-1-03","ch":1,"level":"1-1","tag":"商品勞務","diff":2,"q":"以下哪一項屬於無形的服務，而不是有形商品？","opts":["理髮店提供的剪髮","超級市場售賣的蘋果","電器店出售的風扇","書店架上的一本教科書"],"ans":0,"exp":"解析：商品是實物，服務是無形勞務。剪髮沒有留下可以帶走的實物，只是即時提供的勞務，所以屬服務。蘋果、風扇、教科書都是有形商品。陷阱在於以為「要付錢」就是商品的特徵，其實服務同樣要付錢。","src":"課堂筆記 Ch12"},{"id":"1-1-04","ch":1,"level":"1-1","tag":"商品勞務","diff":3,"q":"以下哪一組項目「全部」屬於服務，而沒有混入有形商品？","opts":["補習、傢具、維修","汽車、保險、銀行存款","手機、網購、租車","補習、維修、銀行存款"],"ans":3,"exp":"解析：補習、維修、銀行存款都是無形勞務，顧客買到的是別人提供的服務。傢具、汽車、手機都是有形商品，所以前三組都混入了商品。做這類題要逐項問「有沒有實物可以帶走」，不能只看行業名稱。","src":"課堂筆記 Ch12"},{"id":"1-1-05","ch":1,"level":"1-1","tag":"市場功能","diff":2,"q":"市場在經濟體系中最基本的經濟功能是什麼？","opts":["由政府統一分配所有資源","把分散的買方需求與賣方供應連結起來","保證每個賣家都能夠獲利","消除所有商品之間的價格差異"],"ans":1,"exp":"解析：市場的功能是把分散在各處的需求與供應拉在一起，讓買賣得以進行。市場不負責統一分配資源，那是計劃經濟的做法；市場也不保證賣家賺錢，更不會消除價格差異。其他選項都把市場的功能講得過大。","src":"課堂筆記 Ch12"},{"id":"1-1-06","ch":1,"level":"1-1","tag":"價格形成","diff":3,"q":"關於市場上的價格怎樣形成，下列說法哪一項正確？","opts":["由賣家單方面按成本加成決定","由買家單方面按自己需要決定","由政府按政策目標釐定","由買賣雙方在市場上互動形成"],"ans":3,"exp":"解析：價格是買賣雙方互動的結果，賣方想賣高、買方想買低，最後在市場上拉扯出一個雙方都願意接受的價位。把價格說成由賣家、買家或政府單方面決定，都忽略了另一方的反應，是本科最典型的錯覺。","src":"課堂筆記 Ch12"},{"id":"1-1-07","ch":1,"level":"1-1","tag":"價格形成","diff":2,"q":"「價格是買賣雙方互動的結果」，這句話的意思是？","opts":["賣家有絕對權力單方面訂價","買家有絕對權力把價格壓低","成交價反映雙方各自願意接受的條件","價格一經訂立就不會再改變"],"ans":2,"exp":"解析：成交價要買方肯付、賣方肯收才會出現，所以它反映的是雙方意願的交集。賣家或買家都不可能單方面說了算，任何一方要價太離譜，交易就做不成。價格會隨供求情況改變，並非一訂就永遠不變。","src":"課堂筆記 Ch12"},{"id":"1-1-08","ch":1,"level":"1-1","tag":"價格形成","diff":4,"q":"球鞋原價 800 元，賣家見需求踴躍把標價升至 1,200 元，結果銷量急跌，回降至 850 元才回復。這說明什麼？","opts":["賣家可以任意訂價而不受任何限制","價格最終由買賣雙方互動決定，賣家不能單方面說了算","買家集體抵制一定能夠成功","球鞋的生產成本在期間下降了"],"ans":1,"exp":"解析：賣家調高標價後銷量大跌，說明買方願意付的數額限制了價格，最後的成交價是雙方拉扯出來的。第一項忽略了買方的反應；第三項把結果歸因於抵制，但題幹沒有提到組織行動；第四項與題幹無關。","src":"課堂筆記 Ch12"},{"id":"1-1-09","ch":1,"level":"1-1","tag":"市場功能","diff":3,"q":"市場價格在協調買賣雙方的行為上，發揮什麼主要作用？","opts":["傳遞供求訊息，引導買賣雙方調整數量","只用來計算政府可以收取的稅款","只反映賣家的生產成本","只反映買家的個人偏好"],"ans":0,"exp":"解析：價格像一個訊號，把市場上的供求狀況傳給買賣雙方，雙方據此調整買多少、賣多少。價格不是只屬於某一方的數字：它既受買家偏好影響，也受賣家成本影響，同時也不是政府收稅的工具。","src":"課堂筆記 Ch12"},{"id":"1-1-10","ch":1,"level":"1-1","tag":"市場界定","diff":3,"q":"某人只在手機應用程式上接單維修冷氣，從不設門市。這是否構成市場的一部分？","opts":["不構成，因為他沒有實體店舖","不構成，因為維修屬於服務而非商品","構成，因為他與客戶為交易服務而接觸","構成，但要等他註冊公司之後才算"],"ans":2,"exp":"解析：市場不要求實體地點，也不限於商品交易，服務同樣在市場上買賣。第一項誤把場所當成必要條件；第二項誤把服務排除在市場之外；第四項虛構了一個不存在的條件，是否註冊公司與市場是否存在無關。","src":"課堂筆記 Ch12"},{"id":"1-1-11","ch":1,"level":"1-1","tag":"商品勞務","diff":2,"q":"關於商品與服務的分類，下列哪一項配對正確？","opts":["商品：無形勞務","服務：有形實物","商品與服務都不能在市場上交易","商品：有形實物；服務：無形勞務"],"ans":3,"exp":"解析：商品是實物，服務是無形的勞務，兩者的分別在於有沒有實物可以交付。前兩項把兩者的定義對調了，是最常見的混淆；第三項更錯，商品與服務都在市場上交易，只是形態不同。","src":"課堂筆記 Ch12"},{"id":"1-1-12","ch":1,"level":"1-1","tag":"市場界定","diff":4,"q":"一個小鎮只有一間雜貨店，居民別無選擇。這是否仍算一個市場？","opts":["是，只要有買賣雙方為交易而接觸就算市場","否，賣家太少不足以構成市場","否，因為價格由店主單方面決定","否，因為居民的需求沒有被滿足"],"ans":0,"exp":"解析：市場的存在只看買賣雙方有沒有為交易而接觸，賣家數目多少屬於「市場結構」的層次，不是「是否市場」的條件，兩者不要混為一談。第二項正是把兩個層次混淆；第三、四項都不是否定市場存在的理由。","src":"課堂筆記 Ch12"},{"id":"1-1-13","ch":1,"level":"1-1","tag":"市場功能","diff":3,"q":"市場把分散的買方與賣方連在一起，最直接的結果是什麼？","opts":["所有商品都變得同質","買賣雙方得以按某個價格完成交易","賣家的數目必然增加","政府的稅收必然上升"],"ans":1,"exp":"解析：市場把需求與供應連結起來之後，最直接的結果就是出現一個價格，雙方可以按這個價格成交。市場不會把商品變成同質，也不會令賣家數目或政府稅收必然增加，這些都是沒有必然關係的推論。","src":"課堂筆記 Ch12"},{"id":"1-1-14","ch":1,"level":"1-1","tag":"供需連結","diff":4,"q":"颱風前夕市民搶購蔬菜，菜價上升；風雨過後供應回復，菜價回落。以下哪項解讀最恰當？","opts":["菜販在颱風前惡意抬價，與需求完全無關","菜價只由供應決定，需求沒有作用","菜價只由需求決定，供應沒有作用","需求與供應的變化透過市場互動反映在價格上"],"ans":3,"exp":"解析：颱風前需求急增推動菜價上升，風雨後供應回復令菜價回落，兩個方向都說明價格是需求與供應共同作用的結果。把價格歸因於單一因素或單純的「惡意抬價」，都忽略了市場互動這個核心機制。","src":"課堂筆記 Ch12"},{"id":"1-1-15","ch":1,"level":"1-1","tag":"市場定義","diff":2,"q":"以下哪一項最符合經濟學上對「市場」的定義？","opts":["買賣雙方為交易商品或服務而接觸的地方或安排","一個由政府劃定的買賣區域","一間售賣日用品的大型商場","一個拍賣行所在的建築物"],"ans":0,"exp":"解析：市場的定義著眼於買賣雙方為交易而接觸，可以是地方，也可以是一種安排，例如網上平台。其餘三項都把市場具體化為某個區域、商場或建築物，把「市場」和「場所」混為一談，正是本科最常見的陷阱。","src":"課堂筆記 Ch12"},{"id":"1-1-16","ch":1,"level":"1-1","tag":"市場界定","diff":3,"q":"以下哪一項「最能」說明市場不限於實體場所？","opts":["街市的攤位需要繳付租金","超級市場有固定的營業時間","二手拍賣群組沒有店面，買賣雙方仍能成交","百貨公司設有停車場方便顧客"],"ans":2,"exp":"解析：二手拍賣群組沒有實體店面，買賣雙方卻照樣完成交易，正好說明市場不必依附於某個地點。其餘三項講的都是實體場所的租金、營業時間或配套設施，不但沒有說明「不限於場所」，反而強化了場所的印象。","src":"課堂筆記 Ch12"},{"id":"1-2-01","ch":1,"level":"1-2","tag":"市場結構","diff":2,"q":"在經濟學中，市場結構的定義是指下列哪一項？","opts":["一個市場的具體地理位置與面積","一種具有特定特徵和競爭行為的典型市場形式","市場中所有商品價格的總和","政府對各類市場的分類登記制度"],"ans":1,"exp":"解析：市場結構講的是一種「典型形式」，它由一組特徵和相應的競爭行為組成，例如完全競爭或壟斷。它與市場的地理位置、價格總和、政府登記都無關，看到「結構」二字不要聯想到物理或行政上的分類。","src":"課堂筆記 Ch12"},{"id":"1-2-02","ch":1,"level":"1-2","tag":"市場結構","diff":2,"q":"市場按什麼標準先分成「完全競爭」與「不完全競爭」兩大類？","opts":["按市場結構的特徵與競爭程度","按市場所在城市的大小","按商品是入口貨還是本地貨","按買家的收入水平高低"],"ans":0,"exp":"解析：分類的第一步是看市場結構本身的特徵與競爭程度，由此分成完全競爭與不完全競爭兩大類。城市大小、貨品來源、買家收入都與市場結構無關，把它們當成分類標準，是把市場的經濟性質和外在標籤混在一起。","src":"課堂筆記 Ch12"},{"id":"1-2-03","ch":1,"level":"1-2","tag":"完全競爭","diff":3,"q":"完全競爭市場中的賣家，面對的是什麼情況？","opts":["可以自行訂價，顧客別無選擇","只能靠廣告區分自己的商品","賣家數目眾多、商品同質，只能接受市場價格","賣家數目眾多但商品各異，可以小幅調價"],"ans":2,"exp":"解析：完全競爭的賣家數目多、商品同質、資訊完全，任何一個賣家都無法影響價格，只能接受市場價格。第一項是壟斷的特徵；第二、四項把商品說成可以區分，那是壟斷性競爭的情況。關鍵在於商品是否同質。","src":"課堂筆記 Ch12"},{"id":"1-2-04","ch":1,"level":"1-2","tag":"不完全競爭","diff":3,"q":"不完全競爭市場與完全競爭市場的主要分別是什麼？","opts":["不完全競爭市場沒有買家存在","不完全競爭市場的商品一定是劣質品","不完全競爭市場不需要考慮價格","不完全競爭市場的賣家對價格有一定影響力"],"ans":3,"exp":"解析：不完全競爭的賣家面對的是向下傾斜的需求，商品有差異或賣家數目少，所以能對價格有一定影響力，這是它與完全競爭的分水嶺。沒有買家、商品劣質、不需考慮價格這三種說法都與市場結構的定義不符。","src":"課堂筆記 Ch12"},{"id":"1-2-05","ch":1,"level":"1-2","tag":"不完全競爭","diff":2,"q":"不完全競爭市場可以再細分為哪三種市場結構？","opts":["完全競爭、寡頭壟斷、壟斷","壟斷性競爭、寡頭壟斷、壟斷","批發、零售、網購","本地、區域、國際"],"ans":1,"exp":"解析：不完全競爭再分為壟斷性競爭、寡頭壟斷、壟斷三種。第一項把完全競爭也放進來，是完全競爭與不完全競爭的界線搞混了；第三、四項是銷售方式與地域的分類，與市場結構的分類維度無關。","src":"課堂筆記 Ch12"},{"id":"1-2-06","ch":1,"level":"1-2","tag":"壟斷性競爭","diff":3,"q":"壟斷性競爭市場在賣家數目與商品性質上有什麼特徵？","opts":["很多賣家，商品異質","只有一個賣家，商品沒有替代品","少數賣家，商品同質","很多賣家，商品同質"],"ans":0,"exp":"解析：壟斷性競爭的名字容易誤導，它不是壟斷：特徵是很多賣家、商品異質，例如靠裝修與服務區分的餐廳。第二項是壟斷；第三項接近寡頭壟斷；第四項是完全競爭。名字有「壟斷」二字，但賣家數目其實很多，這是最常見的陷阱。","src":"課堂筆記 Ch12"},{"id":"1-2-07","ch":1,"level":"1-2","tag":"市場分類","diff":4,"q":"某城市有數十間髮型屋，各有固定客源，靠設計與服務招客，收費各異。這屬於哪一種市場結構？","opts":["完全競爭","壟斷","壟斷性競爭","寡頭壟斷"],"ans":2,"exp":"解析：賣家數目多，但每間髮型屋都靠設計與服務令自己的「商品」與別不同，收費也可以有差異，符合很多賣家加異質商品的特徵，屬於壟斷性競爭。完全競爭要求商品同質；壟斷只有一個賣家；寡頭壟斷賣家數目少。","src":"課堂筆記 Ch12"},{"id":"1-2-08","ch":1,"level":"1-2","tag":"市場分類","diff":4,"q":"一個城市只有一間自來水公司供應全城用水，別無其他選擇。這屬於哪一種市場結構？","opts":["寡頭壟斷","完全競爭","壟斷","壟斷性競爭"],"ans":2,"exp":"解析：整個市場只有一個賣家，沒有替代選擇，進入又受限制，這就是壟斷。寡頭壟斷是少數幾間；完全競爭與壟斷性競爭都要求賣家數目眾多。判斷的關鍵只有一個：賣家是不是只有一個。","src":"課堂筆記 Ch12"},{"id":"1-2-09","ch":1,"level":"1-2","tag":"市場分類","diff":4,"q":"本地只有三間大型電訊商提供流動網絡，各自推出月費優惠搶客。這屬於哪一種市場結構？","opts":["完全競爭","壟斷","壟斷性競爭","寡頭壟斷"],"ans":3,"exp":"解析：由少數幾間大公司佔據市場，彼此以月費優惠互相競爭，正是寡頭壟斷的典型情形。數量少於完全競爭與壟斷性競爭，又多於壟斷；「幾間」這個數目字就是判斷的關鍵，不要因為他們有競爭就誤認為完全競爭。","src":"課堂筆記 Ch12"},{"id":"1-2-10","ch":1,"level":"1-2","tag":"市場分類","diff":3,"q":"街市裡有幾十檔賣同一款青菜，菜的品質完全一樣。這屬於哪一種市場結構？","opts":["完全競爭","寡頭壟斷","壟斷","壟斷性競爭"],"ans":0,"exp":"解析：賣家數目多、商品完全相同，買家只比較價錢，任何一檔都無法影響價格，這是完全競爭。寡頭壟斷要求賣家數目少；壟斷只有一個賣家；壟斷性競爭要求商品異質，而青菜的品質完全一樣，所以不符合。","src":"課堂筆記 Ch12"},{"id":"1-2-11","ch":1,"level":"1-2","tag":"分類維度","diff":2,"q":"經濟學區分市場結構時，通常會看以下哪一組維度？","opts":["只看商品價格的高低","只看市場成立的年份","只看買家的人數","賣家數目、商品性質、進入容易度、市場資訊、競爭行為、市場影響力"],"ans":3,"exp":"解析：市場結構的分類要同時看賣家數目、商品性質、進入市場的容易度、市場資訊、競爭行為和市場影響力等多個維度，不能只靠單一指標。價格高低、成立年份、買家人數都不是分類的維度，單看一項也分不出四種結構。","src":"課堂筆記 Ch12"},{"id":"1-2-12","ch":1,"level":"1-2","tag":"分類維度","diff":3,"q":"下列哪一項「不屬於」區分市場結構的常用維度？","opts":["賣家數目","商品是同質還是異質","進入市場的容易度","市場所在國家的貨幣"],"ans":3,"exp":"解析：賣家數目、商品性質、進入容易度都是標準的分類維度，會直接影響競爭行為與定價能力。市場所在國家使用甚麼貨幣，與市場結構完全沒有關係，是題目刻意加入的無關干擾項，不要因為它跟「市場」有關就選它。","src":"課堂筆記 Ch12"},{"id":"1-2-13","ch":1,"level":"1-2","tag":"市場資訊","diff":3,"q":"「市場資訊」作為分類維度，具體指的是什麼？","opts":["賣家每年投入的廣告預算","政府定期公布的統計年報","買賣雙方對價格與商品質素的了解程度","市場每天營業時間的長短"],"ans":2,"exp":"解析：市場資訊講的是買賣雙方掌握價格與商品質素的程度，完全競爭假設資訊完全，其餘三種結構都假設資訊不完全。廣告預算、統計年報、營業時間都不是「資訊是否完全」這個意義下的市場資訊。","src":"課堂筆記 Ch12"},{"id":"1-2-14","ch":1,"level":"1-2","tag":"壟斷性競爭","diff":3,"q":"以下哪一項「不是」壟斷性競爭市場的特徵？","opts":["市場只有一個賣家","賣家數目眾多","商品彼此異質","進出市場比較容易"],"ans":0,"exp":"解析：壟斷性競爭雖然名字有「壟斷」，但賣家數目眾多，絕不是獨佔。它的特徵正好是很多賣家、商品異質、進出容易。第一項「只有一個賣家」是壟斷的特徵，把它當成壟斷性競爭，就是被名稱誤導的典型錯誤。","src":"課堂筆記 Ch12"},{"id":"1-2-15","ch":1,"level":"1-2","tag":"不完全競爭","diff":2,"q":"以下哪一組市場結構「全部」屬於不完全競爭？","opts":["完全競爭、寡頭壟斷、壟斷","壟斷性競爭、寡頭壟斷、壟斷","寡頭壟斷、完全競爭","完全競爭、壟斷性競爭、壟斷"],"ans":1,"exp":"解析：不完全競爭只有三種：壟斷性競爭、寡頭壟斷、壟斷。其餘三組都混入了完全競爭，而完全競爭正是不完全競爭的對照組。這題考的是分類的層次，先把兩大類分清楚，再往不完全競爭底下數三種。","src":"課堂筆記 Ch12"},{"id":"1-2-16","ch":1,"level":"1-2","tag":"市場分類","diff":4,"q":"甲市場有大量賣家、商品同質、資訊完全；乙市場有大量賣家、商品異質、資訊不完全。以下判斷哪一項正確？","opts":["甲、乙都屬於完全競爭","甲是完全競爭，乙是壟斷性競爭","甲是壟斷性競爭，乙是完全競爭","甲、乙都屬於壟斷"],"ans":1,"exp":"解析：甲的商品同質、資訊完全，符合完全競爭；乙的賣家同樣多，但商品異質、資訊不完全，屬於壟斷性競爭。兩者賣家數目一樣，差別只在商品性質與資訊，這正是分辨這兩個結構的關鍵，不要只看賣家數目就下結論。","src":"課堂筆記 Ch12"},{"id":"1-3-01","ch":1,"level":"1-3","tag":"賣家數目","diff":2,"q":"完全競爭市場上存在大量賣家，任何一戶都只佔極小比重，無法左右市價。這描述的是哪一個分類維度？","opts":["賣家數目","商品性質","市場資訊","進入容易度"],"ans":0,"exp":"解析：題幹講的是「有多少個賣家」，屬賣家數目這一維度。商品性質問的是同質還是異質，市場資訊問買賣雙方掌握資訊的完整程度，進入容易度問新賣家能否自由加入，三者都不是題幹的重點。","src":"課堂筆記 Ch12"},{"id":"1-3-02","ch":1,"level":"1-3","tag":"商品性質","diff":2,"q":"壟斷性競爭市場所售賣的商品，在性質上有甚麼特點？","opts":["完全同質，買家視為一樣","必定是無形服務","全部由政府統一供應","異質，各賣家的商品有差別"],"ans":3,"exp":"解析：壟斷性競爭是「很多賣家＋異質商品」，賣家靠品牌、包裝、地點等差異區分商品，所以不是同質。這是本關最易錯之處：同質商品只出現在完全競爭與寡頭壟斷。無形服務與政府供應都與市場結構的分類無關。","src":"課堂筆記 Ch12"},{"id":"1-3-03","ch":1,"level":"1-3","tag":"進入容易度","diff":2,"q":"某一市場結構中只有一個賣家，其他賣家要加入受到限制。這是哪一種市場結構？","opts":["完全競爭","寡頭壟斷","壟斷","壟斷性競爭"],"ans":2,"exp":"解析：只有一個賣家、進入受限制，是壟斷的標誌。寡頭壟斷是「少數」生產者而非一個，完全競爭與壟斷性競爭則都有很多賣家且進出容易。留意「受限制」與「困難」描述的是不同結構的進入障礙程度。","src":"課堂筆記 Ch12"},{"id":"1-3-04","ch":1,"level":"1-3","tag":"市場資訊","diff":2,"q":"四種市場結構之中，買賣雙方對價格與商品資訊掌握得最完全的是哪一種？","opts":["壟斷","完全競爭","寡頭壟斷","壟斷性競爭"],"ans":1,"exp":"解析：完全競爭的特徵之一是資訊完全，買賣雙方都清楚價格與商品內容，賣家無法靠資訊差抬價。其餘三種都屬資訊不完全：壟斷與寡頭壟斷的賣家掌握較多資訊，壟斷性競爭的買家也難以完全比較異質商品。","src":"課堂筆記 Ch12"},{"id":"1-3-05","ch":1,"level":"1-3","tag":"競爭程度","diff":2,"q":"四種市場結構之中，競爭程度最高的是哪一種？","opts":["壟斷性競爭","完全競爭","寡頭壟斷","壟斷"],"ans":1,"exp":"解析：競爭程度由低至高是壟斷、寡頭壟斷、壟斷性競爭、完全競爭，所以最高是完全競爭。賣家多、商品同質、資訊完全、進出自由，競爭自然最激烈。壟斷只有一個賣家，競爭程度最低。","src":"課堂筆記 Ch12"},{"id":"1-3-06","ch":1,"level":"1-3","tag":"結構配對","diff":3,"q":"某市場有少數幾間生產者，商品可以同質也可以異質，新賣家進入困難。這最可能是哪一種市場結構？","opts":["完全競爭","壟斷","寡頭壟斷","壟斷性競爭"],"ans":2,"exp":"解析：「少數生產者」是寡頭壟斷的關鍵，加上進入困難、商品可同質可異質，四項都吻合。完全競爭與壟斷性競爭的賣家都很多且進出容易，壟斷則只有一個賣家。陷阱在「商品可同質可異質」，這句只屬於寡頭壟斷。","src":"課堂筆記 Ch12"},{"id":"1-3-07","ch":1,"level":"1-3","tag":"同質異質","diff":3,"q":"「同質商品」這個特徵可能出現在哪兩種市場結構？","opts":["完全競爭與寡頭壟斷","壟斷與寡頭壟斷","壟斷性競爭與完全競爭","四種市場結構都有可能"],"ans":0,"exp":"解析：完全競爭一定是同質商品，寡頭壟斷則可同質可異質，所以這兩種都可能出現同質商品。壟斷性競爭一定是異質商品；壟斷只有一個賣家，談不上同質與否。最常見的錯誤是以為賣家多就等於同質，其實壟斷性競爭靠差異化競爭。","src":"課堂筆記 Ch12"},{"id":"1-3-08","ch":1,"level":"1-3","tag":"市場影響力","diff":3,"q":"四種市場結構之中，賣家對市場價格的影響力最大的是哪一種？","opts":["完全競爭","壟斷性競爭","寡頭壟斷","壟斷"],"ans":3,"exp":"解析：壟斷市場只有一個賣家，別無選擇的買家只能接受其定價，影響力最大。寡頭壟斷縱然也能影響價格，但要考慮對手反應；壟斷性競爭賣家多、商品可替代，影響力有限；完全競爭的賣家則完全無法影響價格。","src":"課堂筆記 Ch12"},{"id":"1-3-09","ch":1,"level":"1-3","tag":"壟斷特徵","diff":3,"q":"把壟斷市場的八個分類維度逐項核對，完整的特徵組合應該是哪一組？","opts":["一個賣家、進入受限制、資訊不完全、價格影響力最大","少數賣家、進入困難、商品異質、資訊不完全","很多賣家、進出容易、商品同質、資訊完全","很多賣家、進出容易、商品異質、資訊不完全"],"ans":0,"exp":"解析：壟斷＝一個賣家＋進入受限制＋資訊不完全＋價格影響力最大，四項齊全才算完整。第二組是寡頭壟斷，第三組是完全競爭，第四組是壟斷性競爭。做這類題不要只看「賣家數目」一項，要四項一起核對。","src":"課堂筆記 Ch12"},{"id":"1-3-10","ch":1,"level":"1-3","tag":"寡頭特徵","diff":3,"q":"寡頭壟斷與完全競爭在「市場資訊」上有何差別？","opts":["兩者資訊都完全","寡頭壟斷資訊不完全，完全競爭資訊完全","寡頭壟斷資訊完全，完全競爭資訊不完全","兩者資訊都不完全"],"ans":1,"exp":"解析：完全競爭是唯一資訊完全的市場結構，寡頭壟斷則屬資訊不完全，賣家未必公開產量與定價策略。其餘選項把兩者對調，或一併歸為不完全，都是把「賣家少」與「資訊透明」混為一談。","src":"課堂筆記 Ch12"},{"id":"1-3-11","ch":1,"level":"1-3","tag":"壟斷性競爭","diff":3,"q":"街上多間餐廳各自靠裝修、服務與品牌吸引客人，菜式彼此不同，新餐廳可隨時開業。這屬於哪一種市場結構？","opts":["完全競爭","寡頭壟斷","壟斷性競爭","壟斷"],"ans":2,"exp":"解析：賣家很多、進出容易、商品異質，三項合起來就是壟斷性競爭。完全競爭雖也賣家多、進出容易，但商品必須同質；寡頭壟斷只有少數賣家；壟斷只有一個。餐廳靠差異化而非低價取勝，正是壟斷性競爭的典型。","src":"課堂筆記 Ch12"},{"id":"1-3-12","ch":1,"level":"1-3","tag":"完全競爭","diff":3,"q":"街市裡有幾十檔菜販賣同一款青菜，品質與外觀完全一樣。這最接近哪一種市場結構？","opts":["壟斷","寡頭壟斷","壟斷性競爭","完全競爭"],"ans":3,"exp":"解析：賣家多、商品同質、買家可自由比價，符合完全競爭。若各檔青菜品質有明顯差異，就會偏向壟斷性競爭。判斷關鍵不是「檔口多」，而是「商品是否同質」與「資訊是否完全」這兩項。","src":"課堂筆記 Ch12"},{"id":"1-3-13","ch":1,"level":"1-3","tag":"情境辨認","diff":4,"q":"某城市只有一間自來水公司供應全城用水，鋪設管網成本極高，其他公司難以加入。這屬於哪一種市場結構，理由為何？","opts":["寡頭壟斷，因為市場由大型企業主導","壟斷性競爭，因為自來水是異質商品","完全競爭，因為買家數目龐大","壟斷，因為只有一個賣家且新賣家難以進入"],"ans":3,"exp":"解析：全城只有一間公司＝一個賣家，管網成本令新賣家無法進入＝進入受限制，兩項合起來就是壟斷。寡頭壟斷要有「少數」幾個賣家，而此題只有一個；買家多寡不影響結構判別，完全競爭還要求賣家多且商品同質。","src":"課堂筆記 Ch12"},{"id":"1-3-14","ch":1,"level":"1-3","tag":"表格式判斷","diff":4,"q":"同學把四種市場結構的特徵整理成表格，其中哪一格配對是錯的？","opts":["完全競爭：很多賣家、同質商品","寡頭壟斷：商品必定異質","壟斷性競爭：進出容易、資訊不完全","壟斷：一個賣家、價格影響力最大"],"ans":1,"exp":"解析：寡頭壟斷的商品可同質也可異質，說「必定異質」是錯的；「必定異質」只適用於壟斷性競爭。其餘三格都與概念卡一致。表格題要逐格核對，不能只看賣家數目一欄就下判斷。","src":"課堂筆記 Ch12"},{"id":"1-3-15","ch":1,"level":"1-3","tag":"陷阱辨析","diff":4,"q":"小美說：「壟斷性競爭也是壟斷的一種，因為名字裡有壟斷。」哪一項最能反駁她？","opts":["壟斷性競爭的賣家只有一個","壟斷性競爭的市場完全沒有競爭","壟斷性競爭有很多賣家、賣異質商品，與獨家經營的壟斷不同","壟斷性競爭的市場資訊是完全的"],"ans":2,"exp":"解析：壟斷性競爭是「很多賣家＋異質商品」，與只有一個賣家的壟斷完全是兩回事，名字只反映它有少許價格影響力。第一、二項與事實相反；第四項雖在描述壟斷性競爭，但它的資訊是不完全的，因此不能用來反駁。","src":"課堂筆記 Ch12"},{"id":"1-3-16","ch":1,"level":"1-3","tag":"綜合比較","diff":3,"q":"在「進入容易度」這一維度上，哪兩種市場結構同屬進出容易？","opts":["完全競爭與壟斷性競爭","壟斷與寡頭壟斷","壟斷與完全競爭","寡頭壟斷與壟斷性競爭"],"ans":0,"exp":"解析：完全競爭與壟斷性競爭的賣家都可自由進出市場，新賣家加入不受明顯阻礙。壟斷受限制、寡頭壟斷進入困難，所以任何包含它們的組合都不對。兩種「很多賣家」的結構在這一維度相同，差別在商品性質與資訊。","src":"課堂筆記 Ch12"},{"id":"1-4-01","ch":1,"level":"1-4","tag":"價格競爭","diff":2,"q":"所謂價格競爭，指的是賣家採取甚麼手段爭取客人？","opts":["推出贈品與抽獎活動","調低售價，以較低價格搶客","在媒體投放廣告","加價以提升品質形象"],"ans":1,"exp":"解析：價格競爭就是以價格為手段，靠降價或折扣搶客。加價會趕走客人，不是競爭手段；贈品、抽獎與廣告屬非價格競爭，靠商品以外的因素吸引買家。分辨兩者的關鍵是有沒有動到售價本身。","src":"課堂筆記 Ch12"},{"id":"1-4-02","ch":1,"level":"1-4","tag":"非價格競爭","diff":2,"q":"店家推出抽獎、贈品與免費體驗招客，這類手法屬於哪一種競爭行為？","opts":["拍照打卡送贈品","全店八折","會員獨享半價","買二送一的折扣"],"ans":0,"exp":"解析：贈品靠價格以外的誘因吸引買家，屬非價格競爭。其餘三項都以調整售價或折扣幅度為手段，屬價格競爭。廣告、品牌、包裝、服務、贈品都是常見的非價格競爭手法，注意「免費贈品」不等於降價。","src":"課堂筆記 Ch12"},{"id":"1-4-03","ch":1,"level":"1-4","tag":"受價者","diff":2,"q":"price taker（受價者）指無力影響市價、只能接受市場價格的賣家，這種情況出現在哪一種市場結構？","opts":["壟斷","寡頭壟斷","完全競爭","壟斷性競爭"],"ans":2,"exp":"解析：只有完全競爭市場的賣家是受價者，因為賣家極多、商品同質、資訊完全，任何一戶提價就無人購買。其餘三種都是定價者 price maker，能不同程度影響價格。這是本關最常混淆的一點。","src":"課堂筆記 Ch12"},{"id":"1-4-04","ch":1,"level":"1-4","tag":"定價者","diff":2,"q":"哪一種市場結構的賣家不是定價者 price maker？","opts":["壟斷","寡頭壟斷","壟斷性競爭","完全競爭"],"ans":3,"exp":"解析：完全競爭的賣家是受價者，只能接受市場決定的價格。壟斷、寡頭壟斷、壟斷性競爭三者都能影響價格，只是程度不同：壟斷最大，寡頭壟斷要看對手反應，壟斷性競爭因商品異質而有少許影響力。","src":"課堂筆記 Ch12"},{"id":"1-4-05","ch":1,"level":"1-4","tag":"競爭程度排序","diff":2,"q":"把四種市場結構按競爭程度由低至高排列，正確的是哪一項？","opts":["壟斷、寡頭壟斷、壟斷性競爭、完全競爭","完全競爭、壟斷性競爭、寡頭壟斷、壟斷","寡頭壟斷、壟斷、壟斷性競爭、完全競爭","壟斷、壟斷性競爭、寡頭壟斷、完全競爭"],"ans":0,"exp":"解析：賣家越多、商品越同質、進出越自由，競爭越激烈，所以由低至高是壟斷、寡頭壟斷、壟斷性競爭、完全競爭。第二項是完全倒轉，第三項把壟斷與寡頭壟斷對調，第四項把寡頭壟斷與壟斷性競爭對調。","src":"課堂筆記 Ch12"},{"id":"1-4-06","ch":1,"level":"1-4","tag":"競爭行為","diff":3,"q":"哪一種市場結構既沒有價格競爭，也沒有非價格競爭？","opts":["壟斷","寡頭壟斷","壟斷性競爭","完全競爭"],"ans":3,"exp":"解析：完全競爭的賣家是受價者，降價只會白蝕利潤、提價則完全沒有銷路，加上商品同質，做廣告與建立品牌也無用，所以兩種競爭都不存在。其餘三種都能定價，因此都有價格競爭與非價格競爭的空間。","src":"課堂筆記 Ch12"},{"id":"1-4-07","ch":1,"level":"1-4","tag":"競爭程度排序","diff":3,"q":"壟斷性競爭與寡頭壟斷相比，競爭程度何者較高？","opts":["寡頭壟斷較高","兩者相同","壟斷性競爭較高","無法比較"],"ans":2,"exp":"解析：壟斷性競爭賣家多、進出容易，寡頭壟斷只有少數賣家且進入困難，所以壟斷性競爭的競爭程度較高。排序是壟斷最低、寡頭壟斷次之、壟斷性競爭再高、完全競爭最高。不要因為兩者名字都含「壟斷」就以為程度相近。","src":"課堂筆記 Ch12"},{"id":"1-4-08","ch":1,"level":"1-4","tag":"價格競爭","diff":3,"q":"幾間大型電訊商互相推出更低月費與更多數據的優惠搶客，這屬於哪一種競爭行為？","opts":["非價格競爭","價格競爭","品牌競爭","服務競爭"],"ans":1,"exp":"解析：月費與用量優惠直接改動售價水平，屬價格競爭。品牌與服務競爭屬非價格競爭，靠商品以外的因素吸引買家。此情境的市場結構是寡頭壟斷，正是少數賣家互相牽制而出現價格戰的典型。","src":"課堂筆記 Ch12"},{"id":"1-4-09","ch":1,"level":"1-4","tag":"非價格競爭","diff":3,"q":"餐廳花錢重新裝修、加強侍應服務與更改招牌設計，主要屬於哪一種競爭行為？","opts":["非價格競爭","價格競爭","差別取價","割價傾銷"],"ans":0,"exp":"解析：裝修、服務與招牌都不改動菜式價格，靠商品以外的因素吸引客人，屬非價格競爭。差別取價與割價傾銷都涉及不同顧客付不同價或大幅降價，屬價格層面的手段。壟斷性競爭最常用非價格競爭。","src":"課堂筆記 Ch12"},{"id":"1-4-10","ch":1,"level":"1-4","tag":"定價者","diff":3,"q":"關於定價者 price maker，哪一項說法正確？","opts":["只有壟斷市場的賣家是定價者","完全競爭的賣家也是定價者","壟斷、寡頭壟斷與壟斷性競爭的賣家都能影響價格","定價者可以任意定價，不受任何限制"],"ans":2,"exp":"解析：三種不完全競爭的賣家都是定價者，只是影響力大小不同。第一項漏掉寡頭壟斷與壟斷性競爭；第二項把完全競爭誤認為定價者，其實它是受價者；第四項忽略買家反應與對手策略的限制。","src":"課堂筆記 Ch12"},{"id":"1-4-11","ch":1,"level":"1-4","tag":"競爭行為比較","diff":3,"q":"壟斷市場只有一個賣家，它是否仍可能進行非價格競爭？","opts":["不會，壟斷市場完全沒有任何競爭","會，壟斷也可用廣告、品牌與服務爭取買家","不會，壟斷只能靠價格競爭","會，但只限於加價這一種手段"],"ans":1,"exp":"解析：壟斷雖無對手，仍可用廣告、品牌形象與服務維持需求，屬非價格競爭。第三、四項把它限定成只有價格手段，與概念卡「三者都有價格與非價格競爭」不符；第一項更與事實相反。","src":"課堂筆記 Ch12"},{"id":"1-4-12","ch":1,"level":"1-4","tag":"受價者","diff":3,"q":"完全競爭市場中的單一賣家如果把售價定得略高於市價，最可能出現甚麼結果？","opts":["買家仍會購買，只是銷量略減","其他賣家會跟隨加價","政府會介入阻止","買家全數轉向其他賣家，銷量幾乎為零"],"ans":3,"exp":"解析：商品同質、資訊完全，買家知道別家更便宜就會全部轉走，所以提價者的銷量近乎歸零。正因如此，賣家只能接受市價，這就是受價者的意思。其他賣家不會跟隨，因為它們同樣無力影響市價。","src":"課堂筆記 Ch12"},{"id":"1-4-13","ch":1,"level":"1-4","tag":"情境應用","diff":4,"q":"某手機品牌同時推出「舊機換新機折五百元」與「代言人廣告」，這兩項分別屬於哪類競爭？","opts":["折價屬價格競爭，廣告屬非價格競爭","兩者都屬價格競爭","兩者都屬非價格競爭","折價屬非價格競爭，廣告屬價格競爭"],"ans":0,"exp":"解析：以減少實付金額搶客是價格競爭，靠代言人塑造形象則不涉及售價，屬非價格競爭。判斷標準只有一條：有沒有改變買家實際支付的價格。同一間企業可以同時使用兩種手段，在寡頭壟斷與壟斷性競爭中尤其常見。","src":"課堂筆記 Ch12"},{"id":"1-4-14","ch":1,"level":"1-4","tag":"競爭程度排序","diff":4,"q":"甲市場只有一間供應商，乙市場有二十多間小廠商賣同款零件，丙市場有四間大廠互相跟價。競爭程度由低至高應如何排列？","opts":["乙、丙、甲","丙、甲、乙","甲、丙、乙","甲、乙、丙"],"ans":2,"exp":"解析：甲是一個賣家＝壟斷，競爭最低；丙是少數大廠＝寡頭壟斷；乙是很多賣家賣同款商品＝接近完全競爭，競爭最高。所以由低至高是甲、丙、乙。這題要先辨認結構再套用排序，不能直接按賣家數目猜。","src":"課堂筆記 Ch12"},{"id":"1-4-15","ch":1,"level":"1-4","tag":"陷阱辨析","diff":4,"q":"有人認為「只要不是完全競爭，賣家就可以隨意定價」。這個說法的問題在哪裡？","opts":["完全競爭的賣家其實也可以隨意定價","定價者仍受買家需求與對手策略限制，不能任意定價","只有壟斷才能定價，其他結構都不能","定價者只有寡頭壟斷一種"],"ans":1,"exp":"解析：定價者只是「能影響價格」，並非「能任意決定價格」；訂得太高，買家會轉買替代品或減少購買，寡頭壟斷還要考慮對手反擊。第一項把受價者說成定價者，第三、四項則錯誤地縮窄了定價者的範圍。","src":"課堂筆記 Ch12"},{"id":"1-4-16","ch":1,"level":"1-4","tag":"綜合判斷","diff":3,"q":"把四種市場結構與其常見的競爭行為配對，哪一項配對正確？","opts":["完全競爭：以廣告建立品牌形象","壟斷：只能被動接受市場價格","寡頭壟斷：完全沒有價格競爭","壟斷性競爭：屬定價者，同時有價格與非價格競爭"],"ans":3,"exp":"解析：壟斷性競爭的賣家能靠異質商品影響價格，屬定價者，也同時採用降價與廣告、包裝等手段。完全競爭的賣家不會花錢做品牌廣告，因為商品同質；壟斷是定價者而非受價者；寡頭壟斷的價格戰十分常見。","src":"課堂筆記 Ch12"},{"id":"2-1-01","ch":2,"level":"2-1","tag":"總利益","diff":2,"q":"消費者消費某一數量的物品時，所獲得的全部利益稱為甚麼？","opts":["多消費一單位所增加的得益","全部消費單位所獲得的利益合計","實際付出金錢後剩下的差額","賣方從交易中收取的總收入"],"ans":1,"exp":"總利益是把每一單位所獲得的利益累加起來的合計數，重點在「全部數量」。選項 0 描述的是邊際利益，看的是「多一單位」而不是全部；選項 2 是消費者盈餘的概念，要扣除實際支付；選項 3 是賣方的總收入，與消費者獲得的利益方向相反。","src":"課堂筆記 Ch13"},{"id":"2-1-02","ch":2,"level":"2-1","tag":"邊際利益","diff":2,"q":"邊際利益衡量的是消費者做哪一件事時，所得到的額外利益？","opts":["多消費一單位物品","一次買下全部單位物品","以較低價格買入同一商品","把商品轉售給其他買家"],"ans":0,"exp":"邊際利益只看「多一單位」帶來的利益變化，也就是總利益增加的部分。選項 1 說的是總利益涵蓋的範圍，不是邊際；選項 2 價格高低不會改變消費者對該單位的評價；選項 3 轉售屬於賣方行為，與消費者從消費中獲得的利益無關。陷阱是把「多一單位」誤讀成「全部單位」。","src":"課堂筆記 Ch13"},{"id":"2-1-03","ch":2,"level":"2-1","tag":"願付價格","diff":2,"q":"邊際利益等於消費者願意為額外一單位物品付出的哪一個數額？","opts":["願意付出的最低數額","願意付出的平均數額","願意付出的最高數額","市場上既定的成交價格"],"ans":2,"exp":"邊際利益就是消費者對該額外一單位「最多肯付多少」，所以等於願付最高價。選項 0 把方向倒過來，最低願收價是生產者那一邊的概念；選項 1 平均數額是把總利益攤平，不是邊際；選項 3 的市價由市場決定，未必等於某人對該單位的評價。","src":"課堂筆記 Ch13"},{"id":"2-1-04","ch":2,"level":"2-1","tag":"需求曲線","diff":2,"q":"把每一單位商品的邊際利益排列起來，在圖上會形成哪一條曲線？","opts":["供應曲線","平均成本曲線","總成本曲線","需求曲線"],"ans":3,"exp":"邊際利益曲線就是需求曲線，因為消費者對每一單位願意付的最高價，正是他對該單位的評價，把各單位連起來就是需求曲線，通常向下傾斜。選項 0 的供應曲線對應的是生產者的邊際成本；選項 1、2 屬於成本概念，與消費者的評價無關。陷阱是把「需求曲線」記成「供應曲線」。","src":"課堂筆記 Ch13"},{"id":"2-1-05","ch":2,"level":"2-1","tag":"購買決策","diff":2,"q":"消費者會一直購買到邊際利益與價格出現哪一種關係為止？","opts":["邊際利益高於價格","邊際利益等於價格","邊際利益低於價格","邊際利益等於零"],"ans":1,"exp":"只要多一單位的邊際利益仍高於價格，繼續買就有利，所以會買到價格＝邊際利益為止，此時再多買一單位就不再划算。選項 0 是繼續買的條件而不是停止點；選項 2 表示已經買過頭；選項 3 是邊際利益耗盡，不是均衡時的停止條件。","src":"課堂筆記 Ch13"},{"id":"2-1-06","ch":2,"level":"2-1","tag":"總邊際之別","diff":3,"q":"有人說「第三單位的邊際利益是 40 元，所以消費三單位的總利益也是 40 元」。這個說法錯在哪裡？","opts":["把邊際利益當成總利益，漏了累加","把總利益當成邊際利益，重複計算","邊際利益一定會高於總利益","總利益必定等於價格乘以數量"],"ans":0,"exp":"40 元只是「第三單位」帶來的額外利益，總利益要把三單位各自的邊際利益累加起來，數額一定大於 40 元。選項 1 把方向說反了，出錯的是把邊際當成總；選項 2 顛倒了兩者的關係；選項 3 描述的是實付總額，也不是總利益。陷阱就在把「多一單位」的數字直接當成「全部」。","src":"課堂筆記 Ch13"},{"id":"2-1-07","ch":2,"level":"2-1","tag":"向下傾斜","diff":3,"q":"邊際利益曲線通常向下傾斜，反映消費者對陸續增加的單位有甚麼評價？","opts":["每一單位的評價愈來愈高","每一單位的評價固定不變","每一單位的評價愈來愈低","每一單位的評價與數量無關"],"ans":2,"exp":"同一物品陸續增加單位時，消費者對額外一單位的重視程度通常下降，所以邊際利益遞減、需求曲線向下傾斜。選項 0 會使曲線向上傾斜；選項 1 是一條水平線，等於每單位評價完全相同；選項 3 等於否定邊際利益與數量之間的關係。","src":"課堂筆記 Ch13"},{"id":"2-1-08","ch":2,"level":"2-1","tag":"邊際決策","diff":3,"q":"若某一單位的邊際利益低於市價，消費者對這一單位通常會怎樣做？","opts":["仍然買入，因為總利益為正","仍然買入，因為價格由買方決定","不買，因為該單位完全沒有利益","不買，因為多付的錢多於得到的利益"],"ans":3,"exp":"邊際利益低於價格表示這一單位「不值」，買了會令淨得益減少，所以理性的做法是停手。選項 0 混淆了總利益與邊際判斷，個別單位不划算就不該再買；選項 1 錯在價格不是由單一買方決定；選項 2 說得太極端，邊際利益低於價格不等於完全沒有利益。","src":"課堂筆記 Ch13"},{"id":"2-1-09","ch":2,"level":"2-1","tag":"購買數量","diff":3,"q":"某商品的邊際利益依次為 90、70、50、30 元，市價為 60 元。消費者會買幾單位？","opts":["一單位","兩單位","三單位","四單位"],"ans":1,"exp":"第一單位邊際利益 90 高於 60，值得買；第二單位 70 仍高於 60，值得買；第三單位只剩 50，已低於 60，應該停手，所以買兩單位。關鍵是逐單位比較價格，不是看總和。選項 2 誤把第三單位也買下，選項 0 忽略了第二單位仍然划算。","src":"課堂筆記 Ch13"},{"id":"2-1-10","ch":2,"level":"2-1","tag":"願付遞減","diff":3,"q":"小食店老闆說她願意為第一份甜品付 45 元，第二份只願意付 25 元。這反映甚麼？","opts":["甜品的邊際利益下降","甜品的總利益上升","甜品的市價下跌","甜品的供應減少"],"ans":0,"exp":"願意為額外一份付出的最高數額就是邊際利益，由 45 元降到 25 元，表示第二份的邊際利益低於第一份，符合邊際利益遞減。選項 1 的方向錯，單看願付價下降推不出總利益上升；選項 2、3 是市場價格與供應的變化，題幹只講她個人的願付價，不能由此推論。","src":"課堂筆記 Ch13"},{"id":"2-1-11","ch":2,"level":"2-1","tag":"總利益計算","diff":4,"q":"某消費者對三單位物品的願付價依次為 60、50、40 元。若他全部買下，總利益是多少？","opts":["100 元","120 元","50 元","150 元"],"ans":3,"exp":"算式：總利益＝60＋50＋40＝150 元，把三單位各自的邊際利益累加起來就是總利益。選項 2 的 50 只是第二單位的邊際利益；選項 0、1 都是把其中一項漏加或錯加的結果。陷阱在於總利益是累加，不是取最後一單位，也不是取平均值。","src":"課堂筆記 Ch13"},{"id":"2-1-12","ch":2,"level":"2-1","tag":"邊際利益計算","diff":4,"q":"某消費者的總利益在買兩單位時是 130 元，買三單位時是 165 元。第三單位的邊際利益是多少？","opts":["130 元","165 元","35 元","55 元"],"ans":2,"exp":"算式：邊際利益＝165－130＝35 元，即多買一單位令總利益增加的部分。選項 1 的 165 是買三單位的總利益；選項 0 的 130 是買兩單位的總利益；選項 3 的 55 是把 165 除以 3 得到的平均值。陷阱是把總量當成邊際量，看到甚麼數字就抄下來。","src":"課堂筆記 Ch13"},{"id":"2-1-13","ch":2,"level":"2-1","tag":"願付與市價","diff":4,"q":"甲對第一單位願付 60 元、第二單位 45 元、第三單位 30 元。若市價為 40 元，他願意買幾單位？","opts":["一單位","三單位","兩單位","零單位"],"ans":2,"exp":"逐單位比對：第一單位 60＞40 值得買；第二單位 45＞40 仍值得買；第三單位 30＜40 不買，所以是兩單位。選項 1 只看「買得愈多愈好」，忽略了第三單位已低於市價；選項 0 漏掉第二單位；選項 3 則完全沒看到前兩單位都划算。","src":"課堂筆記 Ch13"},{"id":"2-1-14","ch":2,"level":"2-1","tag":"需求曲線計算","diff":4,"q":"需求曲線顯示：價格 80 元時買一單位，價格 60 元時買兩單位。第二單位的邊際利益是多少？","opts":["20 元","80 元","140 元","60 元"],"ans":3,"exp":"算式：需求曲線上價格 60 元對應購買兩單位，代表第二單位剛好值 60 元，即第二單位的邊際利益為 60 元。選項 0 的 20 是兩價格之差 80－60，把價格變動誤當成邊際利益；選項 1 的 80 是第一單位的邊際利益；選項 2 的 140 是兩價格相加。重點是「某一數量對應的價格」就是該單位的邊際利益。","src":"課堂筆記 Ch13"},{"id":"2-1-15","ch":2,"level":"2-1","tag":"曲線定點","diff":3,"q":"在邊際利益（需求）曲線圖上，橫軸是數量、縱軸是價格。某一點的縱坐標代表甚麼？","opts":["該數量下消費者對最後一單位的願付最高價","該數量下消費者對所有單位的平均評價","該數量下消費者已經獲得的總利益","該數量下生產者願意收取的最低價格"],"ans":0,"exp":"需求曲線上的價格，就是「買到該數量時最後一單位的邊際利益」，也就是願為該單位付出的最高價。選項 1 是平均而非邊際；選項 2 的總利益是曲線以下的整塊面積，不是單點的高度；選項 3 的最低願收價屬於供應曲線那一側。這裡要分清「點的高度」與「面積」。","src":"課堂筆記 Ch13"},{"id":"2-1-16","ch":2,"level":"2-1","tag":"邊際累加","diff":3,"q":"若每一單位的邊際利益都大於零，總利益會隨數量增加出現甚麼變化？","opts":["隨數量增加而減少","隨數量增加而增加","與數量無關，保持固定","先增加後減少"],"ans":1,"exp":"總利益是各單位邊際利益的累加，只要邊際利益仍為正，多一單位就再增加一些，總利益便隨數量上升。選項 0、2 與累加的性質矛盾；選項 3 的轉折只會在邊際利益變成負值時出現，題幹並沒有這樣說。關鍵是「邊際利益下降」不等於「邊際利益為負」。","src":"課堂筆記 Ch13"},{"id":"2-2-01","ch":2,"level":"2-2","tag":"消費者盈餘","diff":2,"q":"消費者盈餘的定義，是消費者願意支付的最大數額減去甚麼？","opts":["實際支付的數額","市場的均衡數量","生產者的總成本","政府收取的稅款"],"ans":0,"exp":"消費者盈餘＝願意支付的最大數額－實際支付數額，衡量交易讓買方「賺到」的部分。選項 1 是數量而不是金額；選項 2 屬於生產者那一方；選項 3 是政府收入，三者都與買方的淨得益無關。陷阱是只算願付數額、忘了扣掉真正付出去的錢。","src":"課堂筆記 Ch13"},{"id":"2-2-02","ch":2,"level":"2-2","tag":"圖形面積","diff":2,"q":"在需求與價格的圖上，消費者盈餘對應哪一塊面積？","opts":["價格線以下、供應曲線以上的面積","需求曲線以下、價格線以上的面積","需求曲線以上的全部面積","價格線與縱軸圍成的面積"],"ans":1,"exp":"需求曲線的高度是各單位的願付價，扣掉實際支付的價格線，剩下的就是需求曲線以下、價格線以上的面積。選項 0 把兩條曲線的角色對調，那比較接近生產者盈餘的位置；選項 2 沒有扣掉價格；選項 3 只取價格線與縱軸之間，與願付價無關。","src":"課堂筆記 Ch13"},{"id":"2-2-03","ch":2,"level":"2-2","tag":"盈餘計算","diff":2,"q":"甲願意為某商品付 50 元，實際只付 30 元。甲的消費者盈餘是多少？","opts":["80 元","30 元","20 元","50 元"],"ans":2,"exp":"算式：50－30＝20 元，願付最大數額減實際支付。選項 0 把兩個數字相加；選項 1 只取實際支付額；選項 3 只取願付額，都是漏了相減這一步。陷阱是忘記「實際支付」要被扣掉，把願付價直接當成盈餘。","src":"課堂筆記 Ch13"},{"id":"2-2-04","ch":2,"level":"2-2","tag":"價格下跌","diff":2,"q":"其他條件不變，某商品價格下跌時，消費者盈餘通常會怎樣？","opts":["減少","不變","變為零","增加"],"ans":3,"exp":"價格下跌後，原有買家每單位付得更少，同時原本嫌貴的人也會加入購買，兩者都令消費者盈餘增加。選項 0 把方向倒轉；選項 1 忽略了支付額已經改變；選項 2 只在賣方能完全差別取價時才可能出現。關鍵是盈餘看的是「願付」與「實付」之間的差距。","src":"課堂筆記 Ch13"},{"id":"2-2-05","ch":2,"level":"2-2","tag":"差別取價","diff":2,"q":"若賣方能逐單位按每位消費者的願付最高價收費，消費者盈餘會變成怎樣？","opts":["保持不變","增加一倍","轉移到政府","全部被賣方拿走"],"ans":3,"exp":"每單位都按願付最高價成交，願付與實付相等，差距為零，消費者盈餘被完全吃掉，全部轉為賣方的收益。選項 0 忽略了收費方式已經改變；選項 1 的方向與事實相反；選項 2 與政府無關，這裡並沒有抽稅。這種做法叫完全差別取價。","src":"課堂筆記 Ch13"},{"id":"2-2-06","ch":2,"level":"2-2","tag":"盈餘陷阱","diff":3,"q":"有人說「我買這件外套的總利益是 300 元，所以消費者盈餘也是 300 元」。這句話忽略了甚麼？","opts":["沒有扣掉實際支付的金額","沒有把總利益加倍計算","沒有考慮生產者的成本","沒有扣掉政府徵收的稅款"],"ans":0,"exp":"消費者盈餘是願付最大數額（總利益）減去實際支付，只講總利益必然高估盈餘。選項 1 方向相反，盈餘是扣減而不是加倍；選項 2 的生產者成本不會進入買方的盈餘計算；選項 3 題幹沒提到稅，屬多餘條件。這是本關最常見的陷阱。","src":"課堂筆記 Ch13"},{"id":"2-2-07","ch":2,"level":"2-2","tag":"圖形判斷","diff":3,"q":"需求曲線與價格線之間的面積變大，通常代表消費者盈餘出現甚麼變化？","opts":["消費者盈餘減少","消費者盈餘增加","消費者盈餘不變","消費者盈餘歸零"],"ans":1,"exp":"那塊面積就是消費者盈餘，面積變大代表盈餘增加，常見於價格下跌或需求上升。選項 0 把面積與盈餘的對應關係倒轉；選項 2 忽略了面積已經改變；選項 3 只有價格高到等於願付價、面積消失時才成立。看圖時先認出「需求曲線以下、價格線以上」。","src":"課堂筆記 Ch13"},{"id":"2-2-08","ch":2,"level":"2-2","tag":"舊買家","diff":3,"q":"某商品價格由 60 元跌至 45 元，原本就購買的買家得到的好處是甚麼？","opts":["每單位多付 15 元","購買數量必定減少","消費者盈餘下降","每單位少付 15 元"],"ans":3,"exp":"價格下跌 15 元，原本的買家每單位少付 15 元，差額直接變成消費者盈餘。選項 0 把方向說反；選項 1 價格下跌通常令需求量增加而不是減少；選項 2 與事實相反，盈餘是上升。這裡只講「舊買家」，新加入的買家是盈餘增加的另一個來源。","src":"課堂筆記 Ch13"},{"id":"2-2-09","ch":2,"level":"2-2","tag":"新買家","diff":3,"q":"價格下跌時，除了舊買家付得更少，消費者盈餘增加還有哪一個來源？","opts":["生產者的成本上升","政府補貼增加","新買家加入市場","商品品質下降"],"ans":2,"exp":"價格下跌後，原本願付價低於舊價、因而不買的人開始覺得划算，於是加入購買，新增的盈餘也計入整體。選項 0、3 是成本與品質的變化，與盈餘來源沒有直接關係；選項 1 題幹沒有提及補貼。價格下跌增加盈餘的兩個來源要一起記住：舊買家付少、新買家進場。","src":"課堂筆記 Ch13"},{"id":"2-2-10","ch":2,"level":"2-2","tag":"完全差別取價","diff":3,"q":"完全差別取價之下，消費者盈餘與生產者收益的關係是甚麼？","opts":["消費者盈餘為零，全部歸生產者","消費者盈餘與生產者收益同時增加","消費者盈餘最大，生產者收益最小","兩者都由政府收取"],"ans":0,"exp":"每單位都按消費者的願付最高價成交，買方沒有剩餘，原本的消費者盈餘全部轉為賣方收益。選項 1 錯在買方並沒有增加盈餘；選項 2 把兩者的位置對調，那也是完全競爭下的情況；選項 3 與政府無關。判斷的關鍵是「願付與實付的差額是否還存在」。","src":"課堂筆記 Ch13"},{"id":"2-2-11","ch":2,"level":"2-2","tag":"盈餘計算","diff":4,"q":"某消費者對三單位物品的願付價為 60、50、40 元，市價為 45 元。若他三單位全買，消費者盈餘是多少？","opts":["30 元","15 元","20 元","45 元"],"ans":1,"exp":"算式：總利益 60＋50＋40＝150 元，實付 45×3＝135 元，盈餘 150－135＝15 元；逐單位算是 (60－45)＋(50－45)＋(40－45)＝15 元。選項 2 的 20 元是只買兩單位時的盈餘；選項 0 的 30 元漏算了第三單位的虧損。第三單位願付 40 低於市價，本題指定「全買」才有此結果。","src":"課堂筆記 Ch13"},{"id":"2-2-12","ch":2,"level":"2-2","tag":"盈餘計算","diff":4,"q":"某消費者對兩單位物品的願付價為 100 元與 80 元，市價為 60 元。他買兩單位的消費者盈餘是多少？","opts":["40 元","20 元","60 元","180 元"],"ans":2,"exp":"算式：總利益 100＋80＝180 元，實付 60×2＝120 元，盈餘 180－120＝60 元；逐單位算是 (100－60)＋(80－60)＝60 元。選項 0 只算了第一單位的盈餘；選項 1 只算第二單位；選項 3 的 180 是總利益，忘了扣掉實付。兩種算法都要得出同一個數。","src":"課堂筆記 Ch13"},{"id":"2-2-13","ch":2,"level":"2-2","tag":"價格下跌","diff":4,"q":"價格由 50 元跌至 30 元，消費者對前兩單位的願付價為 50 元與 40 元。買兩單位時，消費者盈餘是多少？","opts":["10 元","20 元","60 元","30 元"],"ans":3,"exp":"算式：總利益 50＋40＝90 元，實付 30×2＝60 元，盈餘 90－60＝30 元。若按舊價 50 元，他只會買第一單位，盈餘為 50－50＝0 元，可見增加同時來自「舊買家付少了」與「新單位加入」。選項 1 的 20 元只算第一單位的盈餘；選項 0 的 10 元只算第二單位；選項 2 的 60 元是實付總額。","src":"課堂筆記 Ch13"},{"id":"2-2-14","ch":2,"level":"2-2","tag":"購買與盈餘","diff":4,"q":"某消費者的邊際利益依次為 40、30、20、10 元，市價為 25 元。他買多少單位、消費者盈餘是多少？","opts":["買兩單位，盈餘 15 元","買兩單位，盈餘 20 元","買三單位，盈餘 20 元","買一單位，盈餘 15 元"],"ans":1,"exp":"算式：第一單位 40＞25、第二單位 30＞25 都值得買，第三單位 20＜25 停手，所以買兩單位；盈餘 (40－25)＋(30－25)＝20 元。選項 0 的數量對但盈餘算錯；選項 2 多買了不划算的第三單位；選項 3 漏掉第二單位。關鍵是先判斷買到哪裡，再逐單位相加。","src":"課堂筆記 Ch13"},{"id":"2-2-15","ch":2,"level":"2-2","tag":"盈餘變化","diff":3,"q":"價格、需求與供應都可能變動，下列哪一種情況會令消費者盈餘減少？","opts":["商品價格下跌","新買家加入市場","商品價格上升","需求曲線向右移"],"ans":2,"exp":"價格上升令實付增加，願付與實付的差距收窄，消費者盈餘減少，部分買家甚至會退出。選項 0 方向相反；選項 1、3 都會令成交量與盈餘增加。判斷的著眼點是兩件事：消費者對該單位的願付價有沒有變，以及實際支付的價格有沒有變。","src":"課堂筆記 Ch13"},{"id":"2-2-16","ch":2,"level":"2-2","tag":"盈餘比較","diff":3,"q":"甲願付 80 元、實付 50 元；乙願付 60 元、實付 55 元。比較兩人的消費者盈餘，可得甚麼結論？","opts":["甲較多，因為願付與實付的差距較大","乙較多，因為實付金額較高","兩人相同，因為都完成了交易","無法比較，因為願付價不同"],"ans":0,"exp":"甲盈餘 80－50＝30 元，乙只有 60－55＝5 元，差距大的是甲。選項 1 把「付得多」誤當成盈餘多；選項 2 錯在交易完成不等於盈餘相同；選項 3 忽略只要各自扣掉實付就可以比較。關鍵是看差額，不是看願付價或實付價的絕對高低。","src":"課堂筆記 Ch13"},{"id":"2-3-01","ch":2,"level":"2-3","tag":"總成本","diff":2,"q":"某廠商的總成本（total cost）可以拆成哪兩部分相加？","opts":["固定成本與可變成本","邊際成本與平均成本","總利益與邊際利益","消費者盈餘與生產者盈餘"],"ans":0,"exp":"總成本＝固定成本＋可變成本。固定成本是不論產量多少都要付的（租金、機器），可變成本隨產量變動（原料、工資）。邊際成本與平均成本是另一組概念，不是拆分總成本的方式；總利益、盈餘都屬利益面，與成本結構無關。","src":"課堂筆記 Ch13"},{"id":"2-3-02","ch":2,"level":"2-3","tag":"總成本計算","diff":4,"q":"某廠商固定成本 120 元、可變成本 80 元，總成本是多少？","opts":["80 元","200 元","120 元","40 元"],"ans":1,"exp":"算式：總成本＝固定成本＋可變成本＝120＋80＝200 元。陷阱是看到「可變成本 80」就直接選 80，或把兩個成本相減得 40。固定成本即使產量為零仍要支付，不能略去不計。","src":"課堂筆記 Ch13"},{"id":"2-3-03","ch":2,"level":"2-3","tag":"邊際成本","diff":3,"q":"在成本概念中，邊際成本指的是下列哪一項？","opts":["生產全部產量的平均花費","不論產量多少都要付的費用","多生產一單位所增加的成本","出售一單位所收到的價格"],"ans":2,"exp":"邊際看的是「多一單位」的增量，邊際成本就是額外生產一單位所增加的成本。選項一是平均成本，選項二是固定成本，選項四是價格／收益，三者都不是邊際概念。把總量的平均與增量的邊際混在一起，是最常見的錯。","src":"課堂筆記 Ch13"},{"id":"2-3-04","ch":2,"level":"2-3","tag":"生產者盈餘","diff":4,"q":"生產者最低願收 20 元，實際以 35 元售出，生產者盈餘是多少？","opts":["55 元","35 元","20 元","15 元"],"ans":3,"exp":"算式：生產者盈餘＝實際收取－最低願收＝35－20＝15 元。陷阱是把兩個數字相加得 55，或直接拿實收 35 當盈餘。最低願收其實就是邊際成本，實收高於它才有盈餘。","src":"課堂筆記 Ch13"},{"id":"2-3-05","ch":2,"level":"2-3","tag":"供應曲線","diff":2,"q":"在供需圖上，廠商的邊際成本曲線同時代表什麼？","opts":["供應曲線","需求曲線","總成本曲線","消費者盈餘面積"],"ans":0,"exp":"邊際成本是生產者願意收取的最低數額，價格要蓋過它才願意供貨，所以邊際成本曲線就是供應曲線。需求曲線對應的是邊際利益，由買方決定；總成本曲線是累加量，不是逐單位願收價。","src":"課堂筆記 Ch13"},{"id":"2-3-06","ch":2,"level":"2-3","tag":"最適產量","diff":3,"q":"追求盈餘最大的廠商，會一直生產到哪一點為止？","opts":["總成本最低的那一點","價格等於邊際成本為止","邊際成本最高的那一點","固定成本完全收回為止"],"ans":1,"exp":"只要價格高於邊際成本，多生產一單位仍帶來正的差額，所以會生產到價格＝邊際成本為止。固定成本已付出、不影響這個決定；邊際成本最高處也不該是停手點——高過價格就是虧，低於價格就該繼續。","src":"課堂筆記 Ch13"},{"id":"2-3-07","ch":2,"level":"2-3","tag":"生產者盈餘","diff":2,"q":"生產者盈餘（producer surplus）的定義是什麼？","opts":["生產者賣出的總收入","總收入減去固定成本","最低願收與實際收取的差額","消費者願付與實付的差額"],"ans":2,"exp":"生產者盈餘＝生產者願意收取的最少數額與實際收取數額的差距。選項一是總收入，還要扣成本才叫盈餘；選項二漏掉可變成本；選項四是消費者盈餘的定義，主體不同。","src":"課堂筆記 Ch13"},{"id":"2-3-08","ch":2,"level":"2-3","tag":"固定成本","diff":3,"q":"關於固定成本（fixed cost）的性質，下列哪一項描述正確？","opts":["固定成本會隨產量增加而上升","固定成本等於邊際成本","固定成本是生產一單位的額外花費","固定成本不影響邊際成本"],"ans":3,"exp":"本關陷阱：固定成本不論產量多少都要付，增產一單位不會多付它，所以邊際成本不受影響；但它決定「要不要開門營業」——收入連固定成本都蓋不住就該退出。其餘選項都把固定成本與可變成本、邊際成本混為一談。","src":"課堂筆記 Ch13"},{"id":"2-3-09","ch":2,"level":"2-3","tag":"邊際成本計算","diff":4,"q":"產量由 3 單位增至 4 單位，總成本由 300 元升到 340 元，第 4 單位的邊際成本是多少？","opts":["300 元","40 元","340 元","85 元"],"ans":1,"exp":"算式：邊際成本＝總成本增加量÷產量增加量＝（340－300）÷1＝40 元。陷阱是拿總成本 340 或平均成本 85 當答案。邊際只問「多這一個單位多花多少」，前面 3 單位的成本不重複計算。","src":"課堂筆記 Ch13"},{"id":"2-3-10","ch":2,"level":"2-3","tag":"最低願收","diff":2,"q":"邊際成本在經濟學上等於生產者的哪一個數額？","opts":["願意收取的最低數額","實際收取的最高數額","平均每單位利潤","總收入減總成本"],"ans":0,"exp":"邊際成本是再生產一單位所需的代價，價格至少要蓋過它，生產者才肯供貨，所以它等於最低願收價。實際收取由市價決定，可能高於它而形成生產者盈餘；平均利潤與總利潤都是整批的算法。","src":"課堂筆記 Ch13"},{"id":"2-3-11","ch":2,"level":"2-3","tag":"再生產判斷","diff":3,"q":"當市場價格高於邊際成本時，追求盈餘的廠商應該怎麼做？","opts":["停產以節省成本","維持產量不變","繼續增產直到價格等於邊際成本","自行提高價格再增產"],"ans":2,"exp":"價格高於邊際成本，代表這一單位的收入多於成本，增產可增加盈餘，所以會一路生產到價格＝邊際成本。停產會白白放棄正的差額；維持產量或自行提價，都不是受價廠商能決定的事。","src":"課堂筆記 Ch13"},{"id":"2-3-12","ch":2,"level":"2-3","tag":"盈餘合計","diff":3,"q":"某廠商連續生產 3 單位，最低願收分別為 10、20、30 元，每單位實收 40 元，生產者盈餘合計多少？","opts":["30 元","90 元","120 元","60 元"],"ans":3,"exp":"算式：逐單位盈餘＝40－10＝30、40－20＝20、40－30＝10，合計 30＋20＋10＝60 元。陷阱是拿總收入 120 元當盈餘，或只算第一單位的 30 元。盈餘是逐單位差額累加，不是總收入。","src":"課堂筆記 Ch13"},{"id":"2-3-13","ch":2,"level":"2-3","tag":"可變成本","diff":2,"q":"在廠商的成本結構中，可變成本指的是什麼？","opts":["產量為零時仍要支付的費用","隨產量變動而改變的成本","多生產一單位的成本","出售商品所收到的金額"],"ans":1,"exp":"可變成本隨產量變動，例如原料、按件計酬的工資；固定成本才是產量為零仍要付的租金與機器保養。「多生產一單位」講的是邊際成本，「收到的金額」是收益，兩者都不屬於成本分類。","src":"課堂筆記 Ch13"},{"id":"2-3-14","ch":2,"level":"2-3","tag":"開業決定","diff":3,"q":"固定成本在廠商決策中的主要作用是決定什麼？","opts":["要不要開門營業","每單位要賣多少錢","邊際成本的高低","消費者盈餘的大小"],"ans":0,"exp":"固定成本已付出、不隨產量變動，所以左右不了「生產多少」；但它決定「要不要開門營業」——收入連固定成本都蓋不住，不如退出。售價由市場決定，消費者盈餘則屬買方概念，兩者都不由固定成本決定。","src":"課堂筆記 Ch13"},{"id":"2-3-15","ch":2,"level":"2-3","tag":"產量計算","diff":4,"q":"市價 50 元，第 1 至 4 單位的邊際成本分別是 20、35、50、65 元，廠商會生產幾單位？","opts":["1 單位","2 單位","3 單位","4 單位"],"ans":2,"exp":"算式：逐單位比較價格與邊際成本，50＞20 增產、50＞35 增產、50＝50 剛好、50＜65 停手，故生產 3 單位。陷阱是看到第 4 單位就以為要生產到 4；邊際成本一旦高過價格，那一單位就是虧的。","src":"課堂筆記 Ch13"},{"id":"2-3-16","ch":2,"level":"2-3","tag":"盈餘圖形","diff":3,"q":"在供需圖上，生產者盈餘對應的是哪一塊面積？","opts":["需求曲線與價格線之間","邊際成本曲線以下的面積","價格線以上的整塊面積","價格線以下、邊際成本曲線以上"],"ans":3,"exp":"生產者盈餘是每單位「實收－最低願收」的累加，圖上就是價格線以下、邊際成本（供應）曲線以上的面積。價格線以上是消費者盈餘；邊際成本以下沒有經濟意義。兩個盈餘的位置不要對調。","src":"課堂筆記 Ch13"},{"id":"2-4-01","ch":2,"level":"2-4","tag":"效率條件","diff":2,"q":"市場達到效率時，價格與邊際利益、邊際成本是什麼關係？","opts":["價格高於邊際成本","價格等於邊際利益也等於邊際成本","價格等於邊際利益但高於邊際成本","邊際利益高於邊際成本"],"ans":1,"exp":"效率條件是價格＝邊際利益＝邊際成本：買方最後一單位得到的利益，剛好等於賣方生產它的成本，雙方都沒有再交易下去的空間。三者只要不相等，就還有改善空間——價格高於邊際成本時交易量偏少。","src":"課堂筆記 Ch13"},{"id":"2-4-02","ch":2,"level":"2-4","tag":"總社會盈餘","diff":3,"q":"在效率分析中，總社會盈餘是由哪兩部分相加而成？","opts":["總利益與總成本","總收入與總支出","消費者盈餘與生產者盈餘","固定成本與可變成本"],"ans":2,"exp":"總社會盈餘＝消費者盈餘＋生產者盈餘，代表買賣雙方從交易中合計得到的好處。總利益、總成本是毛額，要相減才是淨額；收入與支出是同一筆錢的兩面，加起來不構成盈餘。","src":"課堂筆記 Ch13"},{"id":"2-4-03","ch":2,"level":"2-4","tag":"淨損失","diff":2,"q":"淨損失（deadweight loss）在經濟學上指的是什麼？","opts":["總社會盈餘中沒有被獲取、白白流失的部分","消費者少收的金額","生產者多付的成本","政府稅收的總額"],"ans":0,"exp":"淨損失是本來可以達成、卻因交易量不足而沒有實現的總社會盈餘，沒有任何一方得到它。它不是某一方少賺的錢——那類損失往往只是移轉給別人；也不是稅收，稅收是政府實際收到的錢，另有歸屬。","src":"課堂筆記 Ch13"},{"id":"2-4-04","ch":2,"level":"2-4","tag":"淨損失判斷","diff":4,"q":"某市場均衡價 30 元，實際市價卻是 40 元，交易量因此少於均衡量。這種情況會怎樣？","opts":["總社會盈餘達到最大","只有買方受損，賣方得利","沒有淨損失，只是錢移轉","出現淨損失，總社會盈餘減少"],"ans":3,"exp":"市價高於均衡價＝缺乏效率：成交量少於均衡量，那些「邊際利益高於邊際成本」的交易沒發生，總社會盈餘下降，缺口就是淨損失。高價讓賣方多收，但買方少得更多，合計仍變少，不是單純移轉。","src":"課堂筆記 Ch13"},{"id":"2-4-05","ch":2,"level":"2-4","tag":"均衡效率","diff":2,"q":"在供給與需求相交的均衡點上，下列哪一項成立？","opts":["總社會盈餘最大","生產者盈餘為零","消費者盈餘為零","淨損失最大"],"ans":0,"exp":"均衡點上價格＝邊際利益＝邊際成本，所有自願交易都已完成，總社會盈餘最大、淨損失為零。兩個盈餘通常都是正的，不需要一方歸零；均衡是效率的基準，不是淨損失最大的地方。","src":"課堂筆記 Ch13"},{"id":"2-4-06","ch":2,"level":"2-4","tag":"社會盈餘計算","diff":4,"q":"某市場消費者盈餘 80 元、生產者盈餘 60 元，總社會盈餘是多少？","opts":["20 元","60 元","140 元","80 元"],"ans":2,"exp":"算式：總社會盈餘＝消費者盈餘＋生產者盈餘＝80＋60＝140 元。陷阱是把兩個數字相減得 20 元，那是兩群人之間的差距，不是社會總和。評估效率看的是相加後的總量。","src":"課堂筆記 Ch13"},{"id":"2-4-07","ch":2,"level":"2-4","tag":"淨損失承擔","diff":3,"q":"政府把價格定在高於均衡價時，淨損失最後由誰承擔？","opts":["只由消費者承擔","消費者與生產者合計的盈餘一起變少","只由生產者承擔","由政府預算承擔"],"ans":1,"exp":"本關陷阱：淨損失不是某一方賺少了，而是消費者盈餘與生產者盈餘加起來的總量變少，那部分沒有人拿到。高價雖讓賣方每單位收多了，但成交量下滑，雙方合計仍虧；政府也沒有從中得到這筆錢。","src":"課堂筆記 Ch13"},{"id":"2-4-08","ch":2,"level":"2-4","tag":"交易量","diff":3,"q":"市價被推高到均衡價之上，最先出現的變化是什麼？","opts":["交易量增加到均衡量之上","邊際成本下降到價格以下","總社會盈餘先增後減","交易量減少到均衡量之下"],"ans":3,"exp":"價格高於均衡時，買方願意買的數量少於賣方願意賣的數量，實際成交量就被壓到均衡量之下。交易量不會增加；邊際成本由產量決定，不會自動下跌；盈餘是從最大處往下降，不存在先增後減。","src":"課堂筆記 Ch13"},{"id":"2-4-09","ch":2,"level":"2-4","tag":"淨損失計算","diff":4,"q":"均衡量本應 100 單位，市價過高讓成交量只有 70 單位，未成交的 30 單位每單位盈餘 10 元。淨損失多少？","opts":["300 元","700 元","1000 元","30 元"],"ans":0,"exp":"算式：沒能成交的 30 單位，每單位原本可創造 10 元社會盈餘（邊際利益－邊際成本），淨損失＝30×10＝300 元。陷阱是拿成交金額或單位數直接當金額。淨損失只計「本來能成卻沒成」的那部分。","src":"課堂筆記 Ch13"},{"id":"2-4-10","ch":2,"level":"2-4","tag":"淨損失來源","diff":2,"q":"在下列四種情況中，哪一種最可能造成淨損失？","opts":["市場自發形成的均衡價格","買賣雙方自願成交","價格下限訂在高於均衡價","生產者盈餘為正"],"ans":2,"exp":"價格下限訂得比均衡價高，成交量被壓低，就會出現淨損失；價格上限、稅、壟斷定價同理。均衡價格與自願成交是效率的表現，生產者盈餘為正也很正常，都不構成淨損失。","src":"課堂筆記 Ch13"},{"id":"2-4-11","ch":2,"level":"2-4","tag":"效率配對","diff":3,"q":"只有當價格、邊際利益、邊際成本三者的關係如何時，交易量才算處於效率水平？","opts":["價格最高","三者相等","邊際利益最大","邊際成本最小"],"ans":1,"exp":"效率要求價格＝邊際利益＝邊際成本，代表最後一單位的利益與成本相等，再多生產或再少生產都會使總盈餘下降。追求價格最高、邊際利益最大或邊際成本最小，都只顧一方，反而使交易量偏離效率水平。","src":"課堂筆記 Ch13"},{"id":"2-4-12","ch":2,"level":"2-4","tag":"盈餘變化","diff":3,"q":"市價高於均衡價時，消費者盈餘與生產者盈餘合計會怎樣？","opts":["比均衡時多","保持不變","先升後跌","比均衡時少"],"ans":3,"exp":"均衡時總社會盈餘最大，任何偏離（包括市價偏高）都只會讓合計變少，差額即淨損失。高價讓賣方每單位收多了，卻流失了成交量，兩者相加仍低於均衡水平，所以不會變多、不變或先升後跌。","src":"課堂筆記 Ch13"},{"id":"2-4-13","ch":2,"level":"2-4","tag":"淨損失性質","diff":2,"q":"如果市場出現淨損失，這筆損失最後落到誰手上？","opts":["政府","賣方","沒有人拿到，憑空消失","買方"],"ans":2,"exp":"淨損失是本來能創造卻沒創造出來的盈餘，不是把錢從一方搬到另一方，所以沒有任何人收到它——它隨交易量不足而消失。若只是移轉，例如買方多付給賣方，那只是盈餘在兩方之間重新分配，不算淨損失。","src":"課堂筆記 Ch13"},{"id":"2-4-14","ch":2,"level":"2-4","tag":"價格下限","diff":3,"q":"政府設下高於均衡價的價格下限，對交易量與效率的影響是什麼？","opts":["交易量少於均衡量，產生淨損失","交易量多於均衡量，效率提高","交易量不變，只是盈餘重分配","交易量增加，但生產者盈餘下降"],"ans":0,"exp":"價格下限偏高時，願買的人變少、願賣的人變多，實際成交量由較少的一方決定，於是低於均衡量，總社會盈餘下降而形成淨損失。交易量不會增加；也不只是重分配，因為有一部分盈餘根本沒被創造出來。","src":"課堂筆記 Ch13"},{"id":"2-4-15","ch":2,"level":"2-4","tag":"盈餘比較","diff":4,"q":"某市場在均衡時總社會盈餘 200 元；市價被推高後只剩 170 元。淨損失是多少？","opts":["170 元","30 元","200 元","370 元"],"ans":1,"exp":"算式：淨損失＝均衡時的總社會盈餘－實際達到的總社會盈餘＝200－170＝30 元。陷阱是拿 170 或 200 直接當答案，或把兩者相加得 370。淨損失問的是「少了多少」，不是現在還剩多少。","src":"課堂筆記 Ch13"},{"id":"2-4-16","ch":2,"level":"2-4","tag":"效率判斷","diff":3,"q":"在以下四個市場中，哪一個最接近效率狀態？","opts":["市價遠高於均衡價的市場","有價格下限保護的市場","被壟斷者自行定價的市場","價格等於邊際成本也等於邊際利益的市場"],"ans":3,"exp":"效率狀態就是價格＝邊際利益＝邊際成本、成交量等於均衡量。市價偏高、價格下限、壟斷定價都會壓低成交量而產生淨損失。題目問「最接近」，其餘三項都是人為或市場力量造成的偏離。","src":"課堂筆記 Ch13"}]</script>

const bossUnlocked=(ch)=>levelsOf(ch).every(l=>starsOf(l.id)>0);
const wrongIds=()=>Object.keys(S.wrong).filter(id=>BANK.some(q=>q.id===id));
const wrongCount=()=>wrongIds().length;
const owned=()=>S.items.map(id=>ITEMS.find(i=>i.id===id)).filter(Boolean);
const sumOwned=(k)=>owned().reduce((a,i)=>a+(i[k]||0),0);
const maxHpBase=()=>Math.max(1,3+sumOwned('maxHp'));
const critBase=()=>0.05+sumOwned('critAdd');
const critMultOf=()=>Math.max(2,...owned().map(i=>i.critMult||2));
const shopDisc=()=>sumOwned('shopDisc');
const rarityW=(ch)=>ch===1?{C:6,U:3,R:1}:ch===2?{C:4,U:4,R:2}:{C:3,U:4,R:3};

/* ================= 抽題 ================= */
function weightOf(q){const m=S.wrong[q.id]||0;const d=q.diff||2;return (1+Math.min(m,3)*1.6)*(1+0.22*(d-2))}
function pick(pool,n){
  const items=pool.map(q=>({q,w:weightOf(q)}));const out=[];
  while(out.length<n&&items.length){
    let tot=items.reduce((a,b)=>a+b.w,0),r=Math.random()*tot,k=0;
    for(let i=0;i<items.length;i++){r-=items[i].w;if(r<=0){k=i;break}}
    out.push(items.splice(k,1)[0].q);
  }
  return out;
}
function rollItem(){
  const w=rarityW(B.currentLevel?L(B.currentLevel).ch:1);
  const ownedIds=new Set(S.items);
  const pool=ITEMS.filter(i=>!ownedIds.has(i.id));
  if(!pool.length)return null;
  const tot=pool.reduce((a,i)=>a+w[i.rarity],0);let r=Math.random()*tot;
  for(const it of pool){r-=w[it.rarity];if(r<=0)return it}
  return pool[0];
}
function rollOffers(n){
  const out=[];const used=new Set(S.items);
  for(let k=0;k<n;k++){
    const w=rarityW(B.currentLevel?L(B.currentLevel).ch:1);
    const pool=ITEMS.filter(i=>!used.has(i.id));
    if(!pool.length)break;
    const tot=pool.reduce((a,i)=>a+w[i.rarity],0);let r=Math.random()*tot;let sel=pool[0];
    for(const it of pool){r-=w[it.rarity];if(r<=0){sel=it;break}}
    out.push(sel.id);used.add(sel.id);
  }
  return out;
}

/* ================= 計分 ================= */
function calcScore(idx){
  let flat=10,mult=1,critC=critBase(),critM=critMultOf(),cScale=0;
  const combo=B.combo;
  for(const it of owned()){
    flat+=it.flat||0;
    if(it.goldFlat)flat+=Math.min(it.goldFlat.cap||99,Math.floor(S.gold/it.goldFlat.per));
    if(it.comboPer)flat+=Math.min(it.comboPer,combo);
    if(it.lateFlat&&idx>=3)flat+=it.lateFlat;
    if(it.comboMin&&combo>=it.comboMin)flat+=it.comboFlat||0;
    if(it.comboMult&&combo>=it.comboMin)mult*=it.comboMult;
    if(it.firstMult&&idx===0)mult*=it.firstMult;
    if(it.lastMult&&idx===B.qs.length-1)mult*=it.lastMult;
    if(it.posMult&&it.posMult[idx+1])mult*=it.posMult[idx+1];
    if(it.mult)mult*=it.mult;
    cScale+=it.comboScale||0;
  }
  let streak=1+0.25*(combo-1)+cScale*(combo-1);
  if(streak>4)streak=4; // 連擊倍率上限，跨關累積時防止數值失控
  const crit=Math.random()<critC;
  const v=Math.round(flat*streak*mult*(crit?critM:1));
  return {v,crit};
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function itemChips(sell){
  if(!S.items.length)return '<span class="small">道具欄空著</span>';
  return S.items.map((id,k)=>{const it=ITEMS.find(i=>i.id===id);if(!it)return '';
    return `<span class="chip ${it.rarity}" title="${esc(it.desc)}">${it.name}${sell?` <button class="sell" data-act="sell" data-k="${k}">賣</button>`:''}</span>`}).join('');
}
function itemBar(){return `<div class="items">${itemChips(false)}</div>`}
function termsIn(q){
  const text=q.q+' '+q.opts.join(' ');
  const re=/\b[A-Z][A-Za-z0-9]{1,7}\b/g;
  const out=[],seen=new Set();let m;
  while((m=re.exec(text))){const t=m[0];if(DICT[t]&&!seen.has(t)){seen.add(t);out.push(t)}}
  return out;
}
function dictPrice(){return 2+((B&&B.dictUses)||0)}
function lookup(){
  if(!B||!B.qs)return;
  const q=B.qs[B.i];const terms=termsIn(q);
  if(!terms.length){alert('本題題面和選項裡沒有收錄的縮寫。');return}
  const price=dictPrice();
  if(S.gold<price){alert(`金幣不夠，查一次要 ${price} 金幣。`);return}
  S.gold-=price;B.dictUses=(B.dictUses||0)+1;
  B.dictTerms=terms;B.dictOpen=true;
  B.dictThis=(B.dictThis||[]).concat(terms.filter(t=>!(B.dictThis||[]).includes(t)));
  terms.forEach(t=>{S.glossary[t]=(S.glossary[t]||0)+1});
  save();render();
}

    ms:Math.round(S.playMs||0), t:Date.now()

  try{fetch(STAT_API,{method:'POST',body:JSON.stringify(payload),keepalive:true}).catch(()=>{})}catch(e){}
}

function loadStats(){
  STATS='loading';STAT_ERR='';render();
  fetch(STAT_API+'/json?poll=1&since=all')
    .then(r=>r.text())
    .then(txt=>{
      const by={};
      txt.split('\n').forEach(line=>{
        line=line.trim();if(!line)return;
        let m;try{m=JSON.parse(line)}catch(e){return}
        if(!m||m.event!=='message'||!m.message)return;
        let d;try{d=JSON.parse(m.message)}catch(e){return}
        if(!d||!d.id||!d.t)return;
        if(!by[d.id]||d.t>by[d.id].t)by[d.id]=d;
      });
      const now=Date.now();
      STATS=Object.values(by).filter(x=>now-x.t<STAT_KEEP_MS).sort((a,b)=>b.t-a.t);
      render();
    })
    .catch(e=>{STAT_ERR=String((e&&e.message)||e);STATS=[];render()});
}

}
function fmtAgo(t){
  const s=Math.floor((Date.now()-t)/1000);
  if(s<60)return '剛剛';
  if(s<3600)return Math.floor(s/60)+' 分鐘前';
  if(s<86400)return Math.floor(s/3600)+' 小時前';

}

/* ================= 流程 ================= */
function startLevel(id){
  const l=L(id);const pool=poolOf(id);
  if(!pool.length){alert('這個關卡還沒有題目');return}
  const myMax=maxHpBase();
  B={mode:'level',currentLevel:id,qs:pick(pool,6),i:0,hp:myMax,maxhp:myMax,target:l.target,
     score:0,combo:(S.combo||0),correct:0,sel:null,elim:[],hints:sumOwned('hints'),shieldLeft:sumOwned('shield'),
     skips:sumOwned('skips'),dictUses:0,dictThis:[],
     reviveLeft:owned().some(x=>x.revive)?1:0,gain:0,crit:false};
  screen='battle';render();
}
function startBoss(ch){
  const c=CHS.find(x=>x.n===ch);const pool=poolCh(ch);
  const myMax=maxHpBase();
  const extra=owned().some(x=>x.bossTime)?300:0;
  B={mode:'boss',currentLevel:levelsOf(ch).slice(-1)[0].id,ch,qs:pick(pool,20),i:0,hp:myMax,maxhp:myMax,
     target:c.bossTarget,score:0,combo:(S.combo||0),correct:0,sel:null,elim:[],hints:sumOwned('hints'),
     shieldLeft:sumOwned('shield'),skips:sumOwned('skips'),dictUses:0,dictThis:[],
     reviveLeft:owned().some(x=>x.revive)?1:0,gain:0,crit:false,
     deadline:Date.now()+(15*60+extra)*1000};
  screen='battle';render();
}
function answer(idx){
  if(!B||B.sel!==null||B.elim.includes(idx))return;
  const q=B.qs[B.i];B.sel=idx;B.gain=0;B.crit=false;B.dmg=0;S.tot.q++;
  if(idx===q.ans){
    B.correct++;S.tot.c++;B.combo++;
    const r=calcScore(B.i);B.gain=r.v;B.crit=r.crit;B.score+=r.v;
    S.gold+=sumOwned('goldPerCorrect');
    if(B.mode==='review'&&S.wrong[q.id]){S.wrong[q.id]--;if(S.wrong[q.id]<=0)delete S.wrong[q.id]}
  }else{
    S.wrong[q.id]=(S.wrong[q.id]||0)+1;
    // 連擊越高，失誤代價越大：連擊 ≥6 時答錯扣 2 生命
    B.dmg=(B.combo||0)>=6?2:1;
    B.combo=0;
    if(B.reviveLeft>0&&B.hp<=1){B.hp=Math.max(1,B.hp-1);B.reviveLeft--; }
    else if(B.shieldLeft>0){B.shieldLeft--; }
    else B.hp-=B.dmg;
  }
  if(B.mode!=='review')S.combo=B.combo;
  save();render();
}
function useHint(){
  if(!B||B.hints<=0||B.sel!==null)return;
  const q=B.qs[B.i];
  const wrongs=q.opts.map((_,i)=>i).filter(i=>i!==q.ans&&!B.elim.includes(i));
  if(!wrongs.length)return;
  B.elim.push(wrongs[Math.floor(Math.random()*wrongs.length)]);
  B.hints--;render();
}
function skipQ(){
  if(!B||B.sel!==null||B.skips<=0)return;
  B.skips--;B.i++;B.sel=null;B.gain=0;
  if(B.i>=B.qs.length){finishBattle();return}
  render();
}
function nextQ(){
  if(!B||B.sel===null)return;
  B.i++;B.sel=null;B.gain=0;
  if(B.hp<=0||B.i>=B.qs.length){
    if(B.mode==='review'){B=null;screen='review';render();return}
    finishBattle();return}
  render();
}
function finishBattle(){
  clearInterval(timer);
  const total=B.qs.length;
  if(B.mode==='review'){B=null;screen='review';render();return}
  const pass=B.score>=B.target&&B.hp>0;
  const ch=B.mode==='boss'?B.ch:L(B.currentLevel).ch;
  if(!pass){
    let refund=0;
    if(B.mode==='level'||B.mode==='boss'){refund=sumOwned('failRefund')}
    if(refund){S.gold+=refund}
    S.combo=0; // 關卡失敗，連擊斷
    B.result={score:B.score,target:B.target,correct:B.correct,total,refund};
    B.hp=Math.max(0,B.hp);save();screen='fail';render();return;
  }
  const ratio=B.score/B.target;
  let goldGain=4+B.hp*2+(ratio>=1.3?2:0)+sumOwned('endGold');
  if(B.mode==='boss')goldGain+=8;
  S.gold+=goldGain;
  if(B.mode==='level'){
    const stars=ratio>=1.4?3:ratio>=1.15?2:1;
    S.stars[B.currentLevel]=Math.max(starsOf(B.currentLevel),stars);
  }else{
    S.boss[B.ch]=1;
  }
  save();
  S.pending={offers:rollOffers(3+(owned().some(x=>x.rewardExtra)?1:0)),goldGain};
  reportNow();   // 過關就把進度報出去
  screen='reward';render();
}
function openShop(){
  S.shop={offers:rollOffers(3+sumOwned('shopSlots')),rerollCost:2};
  screen='shop';render();
}
function shopPrice(it){
  const disc=shopDisc();
  return Math.max(1,Math.round(it.price*(1-disc)));
}
function buyItem(k){
  const sh=S.shop;if(!sh)return;
  const id=sh.offers[k];if(!id)return;
  const it=ITEMS.find(i=>i.id===id);
  if(S.items.length>=SLOTS){alert('道具欄已滿，先賣一個');return}
  const p=Math.round(it.price*(1-shopDisc()));
  if(S.gold<p){alert('金幣不夠');return}
  S.gold-=p;S.items.push(id);sh.offers.splice(k,1);save();render();
}
function reroll(){
  const sh=S.shop;if(!sh)return;
  const cost=Math.round(sh.rerollCost*(1-shopDisc()));
  if(S.gold<cost){alert('金幣不夠');return}
  S.gold-=cost;sh.offers=rollOffers(3+sumOwned('shopSlots'));sh.rerollCost+=1;save();render();
}
function sellItem(k){
  if(!S.items[k])return;
  const it=ITEMS.find(i=>i.id===S.items[k]);
  const back=Math.max(1,Math.floor(it.price/2));
  S.items.splice(k,1);S.gold+=back;save();render();
}
function pickOffer(id){
  if(S.items.length>=SLOTS){alert('道具欄已滿，先賣一個');return}
  S.items.push(id);save();openShop();
}
function skipOffer(){S.gold+=4;save();openShop();}
function startMock(){
  const qs=pick(BANK,Math.min(50,BANK.length));
  B={mode:'mock',qs,i:0,answers:new Array(qs.length).fill(null),deadline:Date.now()+60*60*1000};
  screen='mock';render();
}
function mockAns(idx){B.answers[B.i]=idx;render()}
function mockNext(){if(B.i<B.qs.length-1)B.i++;render()}
function mockPrev(){if(B.i>0)B.i--;render()}
function mockSubmit(){
  clearInterval(timer);
  let correct=0;B.qs.forEach((q,i)=>{if(B.answers[i]===q.ans)correct++});
  const score=Math.round(correct/B.qs.length*1000);
  const pass=score>=700;if(pass)S.mockPass++;
  S.best=Math.max(S.best,score);S.tot.q+=B.qs.length;S.tot.c+=correct;save();
  B.result={correct,score,pass};screen='mockresult';render();
}
function resetAll(){
  if(!confirm('清空所有進度（導入的題庫會保留）？'))return;
  S=fresh();save();screen='menu';render();
}
function importBank(text){
  let data;try{data=JSON.parse(text)}catch(e){alert('JSON 解析失敗：'+e.message);return}
  if(!Array.isArray(data)){alert('需要一個數組');return}
  const ok=data.filter(d=>d&&d.id&&d.q&&Array.isArray(d.opts)&&d.opts.length===4&&Number.isInteger(d.ans)&&d.level);
  if(!ok.length){alert('沒有合法題目');return}
  ok.forEach(d=>{d.ch=d.ch||Number(String(d.level)[0]);d.src=d.src||'導入'});
  const custom=loadCustom().filter(x=>!ok.some(y=>y.id===x.id)).concat(ok);
  try{localStorage.setItem(CKEY,JSON.stringify(custom))}catch(err){alert('題庫太大，存不下：'+err.message);return}
  BANK=BASE.concat(custom);
  alert(`導入 ${ok.length} 題，當前題庫 ${BANK.length} 題`);
  screen='menu';render();
}

/* ================= 交互 ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='map'){screen='map';render()}
  else if(act==='stats'){STATS=null;screen='stats';loadStats()}
  else if(act==='stats-load'){loadStats()}
  else if(act==='stats-report'){reportNow();alert('已把你的進度送上去了。統計頁要重新整理才看得到。')}
  else if(act==='name-save'){
    const ni=document.getElementById('namein');
    S.name=((ni&&ni.value)||'').trim().slice(0,14);
    S.nameAsked=true;ensurePid();save();reportNow();render();
  }
  else if(act==='name-skip'){S.nameAsked=true;save();render()}
  else if(act==='menu'){screen='menu';render()}
  else if(act==='cards'){screen='cards';render()}
  else if(act==='review'){screen='review';render()}
  else if(act==='review-run'){
    const ids=wrongIds();const qs=pick(ids.map(id=>BANK.find(q=>q.id===id)),Math.min(10,ids.length));
    B={mode:'review',qs,i:0,hp:99,maxhp:99,target:0,score:0,combo:0,correct:0,sel:null,elim:[],hints:0,
       shieldLeft:0,reviveLeft:0,dictUses:0,dictThis:[],gain:0,crit:false};
    screen='battle';render();
  }
  else if(act==='import'){screen='import';render()}
  else if(act==='reset'){resetAll()}
  else if(act==='intro'){B={currentLevel:el.dataset.id};screen='intro';render()}
  else if(act==='start'){startLevel(B.currentLevel)}
  else if(act==='opt'){answer(+el.dataset.i)}
  else if(act==='hint'){useHint()}
  else if(act==='skipq'){skipQ()}
  else if(act==='dict'){lookup()}
  else if(act==='dict-close'){B.dictOpen=false;render()}
  else if(act==='next'){nextQ()}
  else if(act==='flee'){clearInterval(timer);screen='map';B=null;render()}
  else if(act==='retry'){B.sel=null;if(B.mode==='boss')startBoss(B.ch);else startLevel(B.currentLevel)}
  else if(act==='boss'){startBoss(+el.dataset.ch)}
  else if(act==='pick'){pickOffer(el.dataset.id)}
  else if(act==='skip'){skipOffer()}
  else if(act==='buy'){buyItem(+el.dataset.k)}
  else if(act==='reroll'){reroll()}
  else if(act==='leave'){screen='map';render()}
  else if(act==='sell'){sellItem(+el.dataset.k)}
  else if(act==='mock'){startMock()}
  else if(act==='mopt'){mockAns(+el.dataset.i)}
  else if(act==='mock-next'){if(B.i===B.qs.length-1)mockSubmit();else mockNext()}
  else if(act==='mock-prev'){mockPrev()}
  else if(act==='mock-submit'){if(confirm('確定交卷？'))mockSubmit()}
  else if(act==='import-text'){importBank(document.getElementById('importbox').value)}
  else if(act==='import-file'){document.getElementById('filein').click()}
});
document.getElementById('filein').addEventListener('change',ev=>{
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>importBank(r.result);r.readAsText(f,'utf-8');
});
document.addEventListener('keydown',e=>{
  if(screen==='battle'){
    if(B&&B.sel!==null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nextQ()}
    else if(/^[1-4]$/.test(e.key))answer(+e.key-1);
  }else if(screen==='mock'&&/^[1-4]$/.test(e.key)){mockAns(+e.key-1)}
});
render();

/* 遊玩時長：每 15 秒記一次，頁面隱藏不計 */
setInterval(()=>{ if(!document.hidden) S.playMs=(S.playMs||0)+15000; },15000);
/* 每 3 分鐘自動上報一次進度 */
setInterval(()=>{ if(!document.hidden) reportNow(); },180000);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){save();reportNow();} });
setTimeout(reportNow,3000);
</script>
